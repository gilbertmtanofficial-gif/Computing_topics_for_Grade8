  <script>/* js/generators.js */
/* Random question generators — create brand-new questions every attempt.
   Each returns {q, a, w:[wrongs], c?:code, h?:html, e?:explanation, t?:true} */
(function () {
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // three distinct numeric distractors near the answer
  const near = (ans, spread = 3, extra = []) => {
    const set = new Set(); extra.forEach(v => { if (v !== ans && v >= 0) set.add(v); });
    let guard = 0;
    while (set.size < 3 && guard++ < 100) { const v = ans + R(-spread, spread); if (v !== ans && v >= 0) set.add(v); }
    while (set.size < 3) set.add(ans + set.size + 7);
    return [...set].slice(0, 3).map(String);
  };
  const WORDS = ["robot", "python", "laptop", "planet", "guitar", "dragon", "pixel", "rocket", "jungle", "mango", "turtle", "cookie", "school", "galaxy", "tiger", "cloud"];
  const NAMES = ["Ana", "Ben", "Chen", "Dev", "Ella", "Femi", "Gia", "Hiro", "Isla", "Jay", "Kai", "Lina", "Minh", "Nora", "Omar", "Priya"];

  const G = [];
  const add = (objs, fn) => G.push({ objs, fn });

  /* 9P.02 data types */
  add(["9P.02"], () => {
    const opts = [
      () => ({ v: String(R(2, 999)), a: "Integer" }),
      () => ({ v: String(-R(1, 50)), a: "Integer" }),
      () => ({ v: (R(1, 99) + R(1, 99) / 100).toFixed(2), a: "Real" }),
      () => ({ v: "'" + pick("ABCDXYZ?#7".split("")) + "'", a: "Character" }),
      () => ({ v: '"' + pick(["Hello", "Year 8", "Robi", "chatbot", "12 Main St", "07700 900123"]) + '"', a: "String" }),
      () => ({ v: pick(["True", "False"]), a: "Boolean" })
    ];
    const o = pick(opts)();
    const all = ["Integer", "Real", "Character", "String", "Boolean"];
    return { q: "What is the data type of the value stored in x?", c: "x = " + o.v, a: o.a, w: shuffle(all.filter(t => t !== o.a)).slice(0, 3), t: true };
  });

  /* loop total */
  add(["9P.03", "9CT.07", "9CT.06", "9CT.02"], () => {
    const start = R(0, 3), step = pick([1, 1, 2, 3]), count = R(3, 5);
    const stop = start + step * count;
    let total = 0; for (let i = start; i < stop; i += step) total += i;
    const rng = step === 1 ? `range(${start}, ${stop})` : `range(${start}, ${stop}, ${step})`;
    return { q: "What is printed?", c: `total = 0\nfor i in ${rng}:\n    total = total + i\nprint(total)`, a: String(total), w: near(total, 4, [total + stop, total - start]), t: true, e: `i takes the values ${[...Array(count).keys()].map(k => start + k * step).join(", ")} — they add up to ${total}.` };
  });

  /* loop count (pseudocode / python) */
  add(["9CT.06", "9CT.02", "9P.03"], () => {
    if (Math.random() < 0.5) {
      const a = R(0, 5), b = a + R(3, 9);
      const n = b - a + 1;
      return { q: "How many times is \"Hello\" output?", c: `FOR i ← ${a} TO ${b}\n    OUTPUT "Hello"\nNEXT i`, a: String(n), w: near(n, 2, [n - 1, n + 1, b]), t: true, e: `Pseudocode FOR loops include both ends: ${a} to ${b} is ${n} times.` };
    }
    const a = R(0, 4), b = a + R(3, 9);
    const n = b - a;
    return { q: "How many times does this loop run?", c: `for i in range(${a}, ${b}):\n    print("Hi")`, a: String(n), w: near(n, 2, [n + 1, n - 1, b]), t: true, e: `range(${a}, ${b}) stops before ${b}, so it runs ${n} times.` };
  });

  /* array index */
  add(["9P.04", "9P.01"], () => {
    const items = shuffle(WORDS).slice(0, R(4, 6));
    const listTxt = "items = [" + items.map(s => `"${s}"`).join(", ") + "]";
    const mode = R(0, 3);
    if (mode === 0) { // len
      return { q: "What is printed?", c: listTxt + "\nprint(len(items))", a: String(items.length), w: near(items.length, 2, [items.length - 1, items.length + 1]), t: true };
    }
    if (mode === 1) { // out of range
      const k = items.length;
      return { q: "What happens when this runs?", c: listTxt + `\nprint(items[${k}])`, a: "IndexError (runtime error)", w: [`It prints "${items[k - 1]}"`, `It prints "${items[0]}"`, "Syntax error"], e: `Indexes go from 0 to ${k - 1}, so items[${k}] does not exist.` };
    }
    const k = R(0, items.length - 1);
    const wr = shuffle(items.filter((_, i) => i !== k)).slice(0, 3);
    return { q: "What is printed?", c: listTxt + `\nprint(items[${k}])`, a: items[k], w: wr, t: true, e: `Index ${k} is item number ${k + 1}, because indexes start at 0.` };
  });

  /* string manipulation */
  add(["9P.05"], () => {
    const w = pick(WORDS); const word = Math.random() < 0.5 ? w[0].toUpperCase() + w.slice(1) : w.toUpperCase();
    const mode = R(0, 3);
    if (mode === 0) return { q: "What is printed?", c: `word = "${word}"\nprint(len(word))`, a: String(word.length), w: near(word.length, 2), t: true };
    if (mode === 1) return { q: "What is printed?", c: `word = "${word}"\nprint(word.lower())`, a: word.toLowerCase(), w: [word.toUpperCase(), word, word[0].toUpperCase() + word.slice(1).toLowerCase()].filter(x => x !== word.toLowerCase()).concat([String(word.length)]).slice(0, 3), t: true };
    if (mode === 2) { const lw = word.toLowerCase(); return { q: "What is printed?", c: `word = "${lw}"\nprint(word.upper())`, a: lw.toUpperCase(), w: [lw, lw[0].toUpperCase() + lw.slice(1), String(lw.length)], t: true }; }
    const n = pick(NAMES), s = pick(["Reyes", "Tran", "Smith", "Khan", "Lopez", "Nguyen"]);
    const ans = (n[0] + s).toLowerCase();
    return { q: "What username is printed?", c: `first = "${n}"\nlast = "${s}"\nprint((first[0] + last).lower())`, a: ans, w: [n[0] + s, (n + s).toLowerCase(), (n[0] + s).toUpperCase()], t: true };
  });

  /* trace a variable */
  add(["9P.11", "9CT.07"], () => {
    const start = R(1, 5), n = R(2, 4), mode = R(0, 2);
    let x = start, code, steps = [x];
    if (mode === 0) { const m = pick([2, 3]); for (let i = 0; i < n; i++) { x *= m; steps.push(x); } code = `x = ${start}\nfor i in range(${n}):\n    x = x * ${m}\nprint(x)`; }
    else if (mode === 1) { for (let i = 1; i <= n; i++) { x += i; steps.push(x); } code = `x = ${start}\nfor i in range(1, ${n + 1}):\n    x = x + i\nprint(x)`; }
    else { const d = R(2, 4); x = start + 20; steps = [x]; for (let i = 0; i < n; i++) { x -= d; steps.push(x); } code = `x = ${start + 20}\nfor i in range(${n}):\n    x = x - ${d}\nprint(x)`; }
    return { q: "Complete a trace table in your head. What is printed?", c: code, a: String(x), w: near(x, 5, [steps[steps.length - 2]]), t: true, e: "x takes the values: " + steps.join(" → ") };
  });

  /* test data */
  add(["9P.09", "9P.08"], () => {
    const ctx = pick([["age", 11, 16], ["mark", 0, 100], ["number of tickets", 1, 6], ["shoe size", 3, 12], ["level", 1, 20], ["temperature setting", 16, 30]]);
    const [what, lo, hi] = ctx; const kind = pick(["Normal", "Extreme", "Invalid", "Invalid"]);
    let v;
    if (kind === "Normal") v = R(lo + 1, hi - 1);
    else if (kind === "Extreme") v = pick([lo, hi]);
    else v = pick([lo - R(1, 3), hi + R(1, 5), '"' + pick(["ten", "abc", "?"]) + '"']);
    return { q: `A program accepts a ${what} from ${lo} to ${hi} (inclusive). What type of test data is ${v}?`, a: kind, w: ["Normal", "Extreme", "Invalid", "Syntax"].filter(k => k !== kind).slice(0, 3), t: true,
      e: kind === "Extreme" ? "It is right on the boundary but still allowed." : kind === "Normal" ? "It is safely inside the range." : "It is outside the range or the wrong type, so it should be rejected." };
  });

  /* binary search */
  add(["9CT.05"], () => {
    const n = pick([7, 9, 11]); const set = new Set(); while (set.size < n) set.add(R(1, 99));
    const arr = [...set].sort((a, b) => a - b);
    if (Math.random() < 0.5) {
      const mid = arr[Math.floor((n - 1) / 2)];
      return { q: "Using a binary search on this list, which value is checked FIRST?", c: JSON.stringify(arr).replace(/,/g, ", "), a: String(mid), w: [String(arr[0]), String(arr[n - 1]), String(arr[Math.floor((n - 1) / 2) + 1])], t: true, e: "Binary search always starts with the middle item." };
    }
    const target = pick(arr); let lo = 0, hi = n - 1, c = 0, seq = [];
    while (lo <= hi) { const m = Math.floor((lo + hi) / 2); c++; seq.push(arr[m]); if (arr[m] === target) break; if (target < arr[m]) hi = m - 1; else lo = m + 1; }
    return { q: `How many comparisons does a binary search need to find ${target}? (middle = (low + high) ÷ 2, rounded down)`, c: JSON.stringify(arr).replace(/,/g, ", "), a: String(c), w: near(c, 2, [arr.indexOf(target) + 1]), t: true, e: "Values checked: " + seq.join(" → ") };
  });

  /* storage units */
  add(["9CS.06"], () => {
    const conv = pick([
      () => { const v = R(2, 16); return [`${v} bytes`, "bits", v * 8, "×8"]; },
      () => { const v = R(2, 12) * 8; return [`${v} bits`, "bytes", v / 8, "÷8"]; },
      () => { const v = R(2, 8); return [`${v} KB`, "bytes", v * 1024, "×1024"]; },
      () => { const v = R(2, 9); return [`${v} MB`, "KB", v * 1024, "×1024"]; },
      () => { const v = R(2, 6); return [`${v} GB`, "MB", v * 1024, "×1024"]; },
      () => { const v = R(2, 5); return [`${v} TB`, "GB", v * 1024, "×1024"]; },
      () => { const v = R(2, 8); return [`${v * 1024} MB`, "GB", v, "÷1024"]; },
      () => { const v = R(2, 8); return [`${v * 1024} KB`, "MB", v, "÷1024"]; },
      () => { const v = R(2, 6); return [`${v} nibbles`, "bits", v * 4, "×4"]; }
    ])();
    const [from, to, ans, how] = conv;
    const wr = [ans * 2, Math.round(ans / 2), String(from).includes("bit") || to === "bits" ? ans + 8 : ans * 1000 / 1024 | 0].filter(v => v !== ans && v > 0);
    return { q: `Convert ${from} into ${to}.`, a: String(ans), w: near(ans, 3, wr), t: true, e: `${from} ${how} = ${ans} ${to}` };
  });

  /* sound samples */
  add(["9CS.05"], () => {
    const rate = pick([1000, 2000, 4000, 8000, 500]), secs = R(2, 10);
    if (Math.random() < 0.5) {
      const ans = rate * secs;
      return { q: `A sound is sampled at ${rate} Hz for ${secs} seconds. How many samples are taken?`, a: String(ans), w: [String(rate + secs), String(rate * (secs + 1)), String(rate * secs * 8)], t: true, e: `samples = sample rate × seconds = ${rate} × ${secs}` };
    }
    const bits = pick([8, 16]); const ansBits = rate * secs * bits; const ans = ansBits / 8;
    return { q: `A ${secs}-second recording uses a sample rate of ${rate} Hz and a bit depth of ${bits} bits. What is the file size in BYTES?`, a: String(ans), w: [String(ansBits), String(ans * 2), String(ans + rate)].filter(x => x !== String(ans)), t: true, e: `${rate} × ${bits} × ${secs} = ${ansBits} bits ÷ 8 = ${ans} bytes` };
  });

  /* logic */
  add(["9CS.07"], () => {
    const A = R(0, 1), B = R(0, 1), C = R(0, 1);
    const exprs = [
      ["A AND B", A & B, false], ["A OR B", A | B, false], ["NOT A", 1 - A, false],
      ["(A AND B) OR C", (A & B) | C, true], ["(A OR B) AND C", (A | B) & C, true],
      ["NOT (A AND B)", 1 - (A & B), false], ["NOT (A OR B)", 1 - (A | B), false],
      ["(A AND B) OR NOT C", (A & B) | (1 - C), true], ["A AND NOT B", A & (1 - B), false]
    ];
    const [ex, out, useC] = pick(exprs);
    if (Math.random() < 0.25) {
      // which gate gives final output
      const fin = ex.startsWith("NOT (") ? "NOT" : ex.includes(") OR") ? "OR" : ex.includes(") AND") ? "AND" : ex.includes("AND NOT") ? "AND" : ex.split(" ")[1] || "NOT";
      if (["AND", "OR", "NOT"].includes(fin)) return { q: `In a logic circuit for Q = ${ex}, which gate produces the final output Q?`, a: fin, w: ["AND", "OR", "NOT", "XOR"].filter(g => g !== fin).slice(0, 3), t: true };
    }
    const ins = `A = ${A}, B = ${B}` + (useC ? `, C = ${C}` : "");
    return { q: `Q = ${ex}. What is Q when ${ins}?`, a: String(out), w: [String(1 - out), "2", "It cannot be worked out"], t: true };
  });

  /* parity 1D */
  add(["9DC.04"], () => {
    const bits = Array.from({ length: 7 }, () => R(0, 1)); const ones = bits.reduce((a, b) => a + b, 0);
    const type = pick(["even", "odd"]);
    if (Math.random() < 0.5) {
      const p = type === "even" ? ones % 2 : 1 - ones % 2;
      return { q: `Using ${type.toUpperCase()} parity, what parity bit should be added to ${bits.join("")}?`, a: String(p), w: [String(1 - p), String(ones), "8"].filter(x => x !== String(p)), t: true, e: `The data has ${ones} ones. With ${type} parity the total must be ${type}.` };
    }
    const byte = [R(0, 1)].concat(bits); const tot = byte.reduce((a, b) => a + b, 0);
    const ok = type === "even" ? tot % 2 === 0 : tot % 2 === 1;
    return { q: `${type.toUpperCase()} parity is being used. The byte ${byte.join("")} is received. What should the receiver decide?`, a: ok ? "No error detected" : "An error has occurred", w: [ok ? "An error has occurred" : "No error detected", "The parity bit is missing", "Change to the other parity"], e: `It has ${tot} ones, which is ${tot % 2 ? "odd" : "even"}.` };
  });

  /* parity 2D */
  add(["9DC.04"], () => {
    const rows = 3, cols = 4; const g = [];
    for (let r = 0; r < rows; r++) { const row = Array.from({ length: cols }, () => R(0, 1)); row.push(row.reduce((a, b) => a + b, 0) % 2); g.push(row); }
    const pr = []; for (let c = 0; c <= cols; c++) pr.push(g.reduce((a, row) => a + row[c], 0) % 2); g.push(pr);
    const er = R(0, rows - 1), ec = R(0, cols - 1); g[er][ec] ^= 1;
    let h = '<table class="tbl mono"><tr><th></th>' + [...Array(cols).keys()].map(c => `<th>C${c + 1}</th>`).join("") + "<th>Parity</th></tr>";
    g.forEach((row, r) => { h += `<tr><th>${r < rows ? "Row " + (r + 1) : "Parity"}</th>` + row.map(v => `<td>${v}</td>`).join("") + "</tr>"; });
    h += "</table>";
    const ans = `Row ${er + 1}, C${ec + 1}`; const wr = new Set();
    while (wr.size < 3) { const o = `Row ${R(1, rows)}, C${R(1, cols)}`; if (o !== ans) wr.add(o); }
    return { q: "EVEN parity was used in this 2D parity check. One bit was changed during transmission. Where is the error?", h, a: ans, w: [...wr], e: "Find the row with an odd number of 1s and the column with an odd number of 1s — the error is where they cross." };
  });

  /* spreadsheet functions */
  add(["9MD.02"], () => {
    const vals = Array.from({ length: 5 }, () => R(10, 99));
    const hasText = Math.random() < 0.4; if (hasText) vals[R(0, 4)] = "absent";
    const nums = vals.filter(v => typeof v === "number");
    let h = '<table class="tbl mono"><tr><th></th><th>A</th></tr>' + vals.map((v, i) => `<tr><th>${i + 1}</th><td>${v}</td></tr>`).join("") + "</table>";
    const f = pick(["MAX", "MIN", "COUNT", "IF"]);
    if (f === "MAX") { const a = Math.max(...nums); return { q: "What does =MAX(A1:A5) return?", h, a: String(a), w: [String(Math.min(...nums)), String(nums.length), String(nums.reduce((x, y) => x + y, 0))], t: true }; }
    if (f === "MIN") { const a = Math.min(...nums); return { q: "What does =MIN(A1:A5) return?", h, a: String(a), w: [String(Math.max(...nums)), String(nums.length), "0"], t: true }; }
    if (f === "COUNT") { const a = nums.length; return { q: "What does =COUNT(A1:A5) return?", h, a: String(a), w: near(a, 2, [5, a - 1, a + 1]), t: true, e: "COUNT only counts cells that contain numbers." }; }
    const i = vals.findIndex(v => typeof v === "number"); const lim = R(4, 8) * 10; const a = vals[i] >= lim ? "Pass" : "Fail";
    return { q: `What does =IF(A${i + 1}>=${lim},"Pass","Fail") show?`, h, a, w: [a === "Pass" ? "Fail" : "Pass", String(vals[i]), "TRUE"], t: true };
  });

  /* database query */
  add(["9MD.06", "9MD.07"], () => {
    const clubs = ["Chess", "Robotics", "Art", "Drama"];
    const recs = shuffle(NAMES).slice(0, 7).map(n => ({ n, y: pick([7, 8, 9]), s: R(40, 99), c: pick(clubs) }));
    let h = '<table class="tbl"><tr><th>Name</th><th>Year</th><th>Score</th><th>Club</th></tr>' + recs.map(r => `<tr><td>${r.n}</td><td>${r.y}</td><td>${r.s}</td><td>${r.c}</td></tr>`).join("") + "</table>";
    const yr = pick([7, 8, 9]), lim = R(5, 8) * 10, club = pick(clubs), club2 = pick(clubs.filter(c => c !== club));
    const qs = [
      [`Year = ${yr} AND Score > ${lim}`, r => r.y === yr && r.s > lim],
      [`Year = ${yr} OR Score > ${lim}`, r => r.y === yr || r.s > lim],
      [`Club = "${club}" OR Club = "${club2}"`, r => r.c === club || r.c === club2],
      [`Club = "${club}" AND Score >= ${lim}`, r => r.c === club && r.s >= lim],
      [`Year <> ${yr} AND Score < ${lim}`, r => r.y !== yr && r.s < lim]
    ];
    const [crit, test] = pick(qs); const a = recs.filter(test).length;
    return { q: `How many records match this search?  ${crit}`, h, a: String(a), w: near(a, 2, [a + 1, Math.max(0, a - 1), 7 - a]), t: true, e: "Matching: " + (recs.filter(test).map(r => r.n).join(", ") || "none") };
  });

  /* FDE ordering */
  add(["9CS.09", "9CS.08"], () => {
    const stages = ["Fetch", "Decode", "Execute"]; const i = R(0, 2);
    const nextS = stages[(i + 1) % 3];
    return { q: `In the fetch–decode–execute cycle, which stage comes straight after ${stages[i].toUpperCase()}?`, a: nextS, w: stages.filter(s => s !== nextS).concat(["Store"]).slice(0, 3), t: true };
  });

  window.GENERATORS = G;
  window.QUtil = { R, pick, shuffle };
})();

<script>/* js/app.js */
/* Grade 8 Computing with Mr. Gilbert — app logic (no frameworks, works on GitHub Pages) */
(function () {
  "use strict";
  const C = window.CONFIG, UNITS = window.UNITS, BANK = window.BANK, GENS = window.GENERATORS, OBJ = window.OBJECTIVES;
  const { shuffle, pick } = window.QUtil;
  const $ = s => document.querySelector(s);
  const view = $("#view");
  const AV = window.TEACHER_AVATAR || "mr-gilbert.png";
  const T = C.teacherName || "Mr. Gilbert";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------------- dates ---------------- */
  const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const dayKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today = () => startOfDay(new Date());
  const fmtD = (d, o) => d.toLocaleDateString(undefined, o || { day: "numeric", month: "short" });
  const fmtDT = iso => new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const fmtTime = secs => { secs = Math.round(secs || 0); const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60); return h ? `${h} h ${m} min` : m ? `${m} min` : `${secs % 60} s`; };
  const hours = secs => (secs / 3600).toFixed(1);

  /* ---------------- content index ---------------- */
  const TOPICS = {}; const UNIT_OF = {};
  UNITS.forEach(u => u.topics.forEach(t => { TOPICS[t.id] = t; UNIT_OF[t.id] = u; }));
  const unitById = id => UNITS.find(u => u.id === id);
  const semUnits = sem => UNITS.filter(u => u.semester === sem);
  const semTopics = sem => semUnits(sem).flatMap(u => u.topics);

  /* ---------------- storage ---------------- */
  const KEY = "compass8_tracker_v1";
  let DB = { profiles: {}, current: null };
  try { DB = JSON.parse(localStorage.getItem(KEY)) || DB; } catch (e) { /* private mode */ }
  let P = null; // current profile
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { } };
  const newProfile = (name, cls) => ({ id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, cls, created: new Date().toISOString(), attempts: [], read: {}, tasks: [], time: { days: {}, topics: {}, total: 0 }, outbox: [], lastSync: null, sem: null, active: null });
  function useProfile(id) { DB.current = id; P = DB.profiles[id]; if (P) { P.time = P.time || { days: {}, topics: {}, total: 0 }; P.outbox = P.outbox || []; } save(); }

  /* ---------------- schedule ---------------- */
  function schedule(sem) {
    const s = C.semesters.find(x => x.id === sem); if (!s) return [];
    let prev = null;
    return (C.weeklyPlan[sem] || []).map(w => {
      const start = w.start ? parseD(w.start) : prev ? addDays(prev, 7) : parseD(s.start); prev = start;
      const fri = addDays(start, 4); let assess;
      if (w.unitTest) { const u = unitById(w.unitTest); assess = { id: "UT-" + w.unitTest, kind: "unit", title: `Unit ${u.num} test`, sub: u.title, date: fri, topics: u.topics.map(t => t.id), n: C.questionsPerUnitTest, sem }; }
      else assess = { id: `SC-${sem}-${w.week}`, kind: "spot", title: `Week ${w.week} spot check`, sub: w.topics.map(id => TOPICS[id] ? TOPICS[id].title : id).join(" · "), date: fri, topics: w.topics, n: C.questionsPerSpot, sem };
      return Object.assign({}, w, { start, end: addDays(start, 6), fri, assess, sem });
    });
  }
  const allAssess = () => [1, 2].flatMap(s => schedule(s).map(w => w.assess));
  const assessById = id => allAssess().find(a => a.id === id);
  function currentWeek(sem) {
    const ws = schedule(sem), t = today(); if (!ws.length) return null;
    if (t < ws[0].start) return Object.assign({ state: "before" }, ws[0]);
    const w = ws.find(w => t >= w.start && t <= w.end); if (w) return Object.assign({ state: "now" }, w);
    const past = ws.filter(w => w.start <= t); return Object.assign({ state: "after" }, past[past.length - 1] || ws[ws.length - 1]);
  }
  function defaultSem() { const s2 = C.semesters.find(s => s.id === 2); return s2 && today() >= addDays(parseD(s2.start), -14) ? 2 : 1; }
  const sem = () => (P && P.sem) || defaultSem();

  /* ---------------- progress helpers ---------------- */
  const attemptsFor = q => (P ? P.attempts.filter(a => a.quiz === q) : []);
  const best = q => { const a = attemptsFor(q); return a.length ? Math.max(...a.map(x => x.pct)) : null; };
  const passed = topicId => { const b = best("T:" + topicId); return b != null && b >= C.passMark; };
  function topicState(id) { const b = best("T:" + id); if (b == null) return P && P.read[id] ? "read" : "new"; return b >= C.passMark ? "passed" : "retry"; }
  const stateTag = id => { const s = topicState(id), b = best("T:" + id); return s === "passed" ? `<span class="tag sm good">✓ Passed ${b}%</span>` : s === "retry" ? `<span class="tag sm warn">Best ${b}% · retry</span>` : s === "read" ? `<span class="tag sm">Read · quiz next</span>` : `<span class="tag sm">Not started</span>`; };

  function weekStatus(w) { const t = today(); if (w.topics.every(passed)) return "done"; if (w.end < t) return "overdue"; if (w.start <= t) return "current"; return "upcoming"; }
  function trend(vals) {
    const n = vals.length; if (n < 2) return { slope: 0, at: i => vals[0] || 0 };
    const xs = vals.map((_, i) => i), mx = (n - 1) / 2, my = vals.reduce((a, b) => a + b, 0) / n;
    let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (vals[i] - my); den += (x - mx) ** 2; });
    const slope = den ? num / den : 0, b = my - slope * mx; return { slope, at: i => Math.max(0, Math.min(100, b + slope * i)) };
  }
  const trendLabel = s => s > 2 ? `<span class="up">▲ Improving</span>` : s < -2 ? `<span class="down">▼ Declining</span>` : `<span class="flat">● Steady</span>`;

  /* ================= QUIZ ENGINE ================= */
  const norm = s => String(s).toLowerCase().trim().replace(/^["'“”‘’]+|["'“”‘’.]+$/g, "").replace(/[\s,]+/g, " ").trim();

  function toItem(raw, obj) { const [q, a, w, x] = raw; return Object.assign({ q, a, w: w || [], obj }, x || {}); }

  function buildQuestions(objectives, n) {
    const seen = new Set(), pool = [];
    objectives.forEach(o => (BANK[o] || []).forEach(r => { const it = toItem(r, o); const k = it.q + "|" + (it.c || ""); if (!seen.has(k)) { seen.add(k); pool.push(it); } }));
    const gens = GENS.filter(g => g.objs.some(o => objectives.includes(o)));
    let gCount = gens.length ? Math.min(Math.round(n * 0.3), gens.length * 3) : 0;
    if (pool.length < n - gCount) gCount = n - pool.length;
    const sp = shuffle(pool), chosen = sp.slice(0, n - gCount), spare = sp.slice(n - gCount);
    const gSeen = new Set(); let guard = 0, gi = 0; const gOrder = shuffle(gens);
    while (chosen.length < n && gens.length && guard++ < 400) {
      const g = gOrder[gi++ % gOrder.length]; const it = g.fn(); const k = it.q + "|" + (it.c || "") + "|" + (it.h || "");
      if (gSeen.has(k)) continue; gSeen.add(k); it.obj = g.objs.find(o => objectives.includes(o)); it.gen = true; chosen.push(it);
    }
    // turn items into rendered questions with a random type
    let qs = chosen.map(it => {
      const wrong = [...new Set(it.w.map(String))].filter(x => x !== String(it.a));
      const typable = !!it.t && String(it.a).length <= 30;
      const r = Math.random(); let type = "mcq";
      if (typable) type = r < 0.45 ? "mcq" : r < 0.65 ? "tf" : "typed"; else type = r < 0.72 ? "mcq" : "tf";
      if (!wrong.length) type = typable ? "typed" : "mcq";
      const acc = [String(it.a)].concat(Array.isArray(it.t) ? it.t : []);
      const base = { obj: it.obj, prompt: it.q, code: it.c, html: it.h, answer: String(it.a), expl: it.e, typable, accept: acc };
      if (type === "mcq") return Object.assign(base, { type, options: shuffle([String(it.a)].concat(wrong.slice(0, 3))) });
      if (type === "tf") { const showRight = Math.random() < 0.5; return Object.assign(base, { type, shown: showRight ? String(it.a) : pick(wrong), truth: showRight ? "True" : "False" }); }
      return Object.assign(base, { type: "typed" });
    });
    // guarantee some typed answers when the topic allows it
    let typedN = qs.filter(q => q.type === "typed").length;
    shuffle(qs.map((q, i) => i)).forEach(i => { if (typedN < 3 && qs[i].typable && qs[i].type !== "typed") { qs[i] = Object.assign({}, qs[i], { type: "typed" }); typedN++; } });
    // add up to 2 matching questions from spare static items (replacing simple ones, keeping the count)
    const short = spare.filter(it => !it.c && !it.h && String(it.a).length <= 42 && it.q.length <= 120);
    for (let m = 0; m < 2 && short.length >= 3 && qs.length >= 6; m++) {
      const trio = []; const used = new Set();
      while (short.length && trio.length < 3) { const it = short.shift(); if (!used.has(String(it.a))) { used.add(String(it.a)); trio.push(it); } }
      if (trio.length < 3) break;
      const replaceAt = qs.findIndex(q => q.type === "mcq" && !q.code && !q.html && !q.matchReplaced);
      if (replaceAt < 0) break;
      qs[replaceAt] = { type: "match", obj: trio[0].obj, prompt: "Match each question to its correct answer.", pairs: trio.map(it => ({ q: it.q, a: String(it.a) })), options: shuffle(trio.map(it => String(it.a))), matchReplaced: true };
    }
    // make sure at least 3 different types appear
    const types = new Set(qs.map(q => q.type));
    if (types.size < 3) { const i = qs.findIndex(q => q.type === "mcq" && q.options && q.options.length > 1); if (i >= 0 && !types.has("tf")) { const q = qs[i]; const w = q.options.filter(o => o !== q.answer); const sr = Math.random() < .5; qs[i] = Object.assign({}, q, { type: "tf", shown: sr ? q.answer : pick(w), truth: sr ? "True" : "False" }); } }
    return shuffle(qs);
  }

  function check(q, v) {
    if (v == null) return false;
    if (q.type === "mcq") return v === q.answer;
    if (q.type === "tf") return v === q.truth;
    if (q.type === "typed") { const a = norm(v), an = normNum(v); return q.accept.some(x => norm(x) === a || normNum(x) === an); }
    if (q.type === "match") return q.pairs.every((p, k) => v[k] === p.a);
    return false;
  }
  function lock(v, timedOut) {
    if (QZ.locked) return; QZ.locked = true; clearInterval(timerId);
    const q = QZ.qs[QZ.i], ok = check(q, v); if (ok) QZ.score++;
    QZ.answers.push({ q, v, ok, timedOut: !!timedOut, secs: Math.round((Date.now() - QZ.qStart) / 1000) });
    P.active.score = QZ.score; P.active.answered = QZ.answers.length; save();
    // reveal
    view.querySelectorAll(".opt").forEach(b => { b.disabled = true; const val = b.dataset.v; const good = q.type === "mcq" ? val === q.answer : val === q.truth; if (good) b.classList.add("right"); else if (val === v) b.classList.add("wrong"); });
    const ti = $("#typedIn"); if (ti) ti.disabled = true;
    view.querySelectorAll(".match select").forEach(s => { s.disabled = true; const k = +s.dataset.k; s.parentElement.classList.add(s.value === q.pairs[k].a ? "right" : "wrong"); });
    const correctTxt = q.type === "match" ? q.pairs.map(p => `${p.q} → <b>${esc(p.a)}</b>`).join("<br>") : q.type === "tf" ? `The proposed answer was <b>${q.truth === "True" ? "correct" : "wrong"}</b>. The correct answer is <b>${esc(q.answer)}</b>.` : `Correct answer: <b class="${isCodey(q.answer) ? "codey" : ""}">${esc(q.answer)}</b>`;
    $("#fb").innerHTML = `<div class="feedback ${ok ? "good" : "bad"}">${timedOut ? "<b>⏱ Time's up!</b> " : ok ? "<b>✓ Correct!</b> " : "<b>✗ Not quite.</b> "}${ok && q.type !== "match" ? "" : correctTxt}${q.expl ? `<div class="mt-s">${esc(q.expl)}</div>` : ""}</div>`;
    const go = $("#go"); go.disabled = false; go.textContent = QZ.i + 1 < QZ.qs.length ? "Next question →" : "See my score →"; $("#hint").textContent = `Score so far: ${QZ.score}/${QZ.answers.length}`; go.focus();
  }
  function nextQ() { QZ.i++; if (QZ.i >= QZ.qs.length) finishQuiz(false, true); else drawQ(); }

  function confetti() {
    const box = document.createElement("div"); box.className = "confetti"; const cols = ["#e3b341", "#f6d77a", "#1b3a6b", "#ffffff", "#a87908", "#3b5f9a"];
    for (let i = 0; i < 90; i++) { const c = document.createElement("i"); c.style.left = Math.random() * 100 + "%"; c.style.background = cols[i % cols.length]; c.style.animationDuration = (1.8 + Math.random() * 1.8) + "s"; c.style.animationDelay = Math.random() * .6 + "s"; c.style.transform = `rotate(${Math.random() * 360}deg)`; box.appendChild(c); }
    document.body.appendChild(box); setTimeout(() => box.remove(), 4500);
  }
  function recordAttempt(quiz, title, kind, score, total, secs, incomplete) {
    const pct = Math.round(score / total * 100);
    const att = { id: Date.now().toString(36), quiz, title, kind, score, total, pct, secs, date: new Date().toISOString() };
    if (incomplete) att.incomplete = true; P.attempts.push(att); P.active = null; save();
    queue(Object.assign({ type: "result", quiz, title, kind, score, total, pct, secs, incomplete: !!incomplete, attemptNo: attemptsFor(quiz).length, date: att.date }, summary()));
    return att;
  }
  function finishQuiz(abandoned, show) {
    clearInterval(timerId); if (!QZ || QZ.done) return; QZ.done = true;
    const secs = Math.round((Date.now() - QZ.started) / 1000);
    const att = recordAttempt(QZ.quiz, QZ.title, QZ.kind, QZ.score, QZ.qs.length, secs, abandoned);
    if (show) showScore(att); else toast(`Quiz submitted: ${att.score}/${att.total} (${att.pct}%)`);
  }
  function showScore(att) {
    const tries = attemptsFor(att.quiz), prevT = tries[tries.length - 2], tr = trend(tries.map(t => t.pct));
    const pass = att.pct >= C.passMark, diff = prevT ? att.pct - prevT.pct : null, proj = tries.length >= 2 ? Math.round(tr.at(tries.length)) : null;

  /* ================= RESULTS ================= */
  function lineChart(vals, labels) {
    const W = 720, H = 270, l = 40, r = 20, t = 18, b = 34, n = vals.length, ext = n >= 2 ? 3 : 0;
    const X = i => l + (n + ext <= 1 ? (W - l - r) / 2 : i * (W - l - r) / (n + ext - 1)), Y = v => t + (100 - v) * (H - t - b) / 100;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scores per try with trend line">`;
    [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`; });
    s += `<line x1="${l}" x2="${W - r}" y1="${Y(C.passMark)}" y2="${Y(C.passMark)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W - r}" y="${Y(C.passMark) - 6}" text-anchor="end" font-size="11" fill="var(--good)" font-weight="700">Pass ${C.passMark}%</text>`;
    if (n >= 2) { const tr = trend(vals); s += `<line x1="${X(0)}" y1="${Y(tr.at(0))}" x2="${X(n - 1)}" y2="${Y(tr.at(n - 1))}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/><line x1="${X(n - 1)}" y1="${Y(tr.at(n - 1))}" x2="${X(n - 1 + ext)}" y2="${Y(tr.at(n - 1 + ext))}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 5"/>`;
      for (let k = 1; k <= ext; k++) { const v = Math.round(tr.at(n - 1 + k)); s += `<circle cx="${X(n - 1 + k)}" cy="${Y(v)}" r="5" fill="#fff" stroke="var(--accent)" stroke-width="2" data-tip="Projected try ${n + k}: ≈${v}%"/>`; }
      s += `<text x="${X(n - 1 + ext)}" y="${Y(tr.at(n - 1 + ext)) - 12}" text-anchor="end" font-size="11.5" fill="var(--accent)" font-weight="700">Projection</text>`; }
    if (n) s += `<polyline fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linejoin="round" points="${vals.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>`;
    vals.forEach((v, i) => { s += `<circle cx="${X(i)}" cy="${Y(v)}" r="5.5" fill="var(--navy)" stroke="#fff" stroke-width="2" data-tip="${esc(labels[i])}"/><circle cx="${X(i)}" cy="${Y(v)}" r="14" fill="transparent" data-tip="${esc(labels[i])}"/>`; });
    for (let i = 0; i < n + ext; i++) if (n + ext <= 16 || i % Math.ceil((n + ext) / 12) === 0) s += `<text x="${X(i)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${i < n ? "Try " + (i + 1) : "+" + (i - n + 1)}</text>`;
    if (n) s += `<text x="${X(n - 1)}" y="${Y(vals[n - 1]) - 12}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${vals[n - 1]}%</text>`;
    return s + "</svg>";
  }
  function barChart() {
    const W = 720, H = 210, l = 40, r = 10, t = 14, b = 34, days = [...Array(14).keys()].map(i => addDays(today(), i - 13));
    const vals = days.map(d => Math.round((P.time.days[dayKey(d)] || 0) / 60)), max = Math.max(30, ...vals), top = Math.ceil(max / 30) * 30;
    const bw = (W - l - r) / 14, Y = v => t + (top - v) * (H - t - b) / top;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes of study per day, last 14 days">`;
    [0, top / 2, top].forEach(v => { s += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}m</text>`; });
    vals.forEach((v, i) => { const x = l + i * bw + 3, h = Y(0) - Y(v); const tipTxt = `${fmtD(days[i], { weekday: "short", day: "numeric", month: "short" })}: ${v} min`;
      if (v > 0) s += `<path d="M${x},${Y(0)} V${Y(v) + Math.min(4, h)} q0,-4 4,-4 h${bw - 14} q4,0 4,4 V${Y(0)} Z" fill="var(--navy)" data-tip="${tipTxt}"/>`;
      s += `<rect x="${x}" y="${t}" width="${bw - 6}" height="${H - t - b}" fill="transparent" data-tip="${tipTxt}"/><text x="${x + (bw - 6) / 2}" y="${H - 12}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${days[i].getDate()}</text>`; });
    return s + "</svg>";
  }

        ${vals.length ? `<div class="small muted" style="margin-bottom:6px">Navy line = your scores · grey dashes = trend · orange = projected next 3 tries. ${vals.length > 1 ? "Status: " + trendLabel(tr.slope) : ""}</div>${lineChart(vals, labels)}` : `<div class="empty">No tries yet. Take a topic quiz and your graph will appear here.</div>`}</div>

        ${rows.map(r => `<tr><td><a href="#results/${encodeURIComponent(r.q)}">${esc(r.title)}</a></td><td class="n">${r.n}</td><td class="n">${r.first}%</td><td class="n">${r.last}%</td><td class="n"><b>${r.best}%</b> ${r.best >= C.passMark ? "✓" : ""}</td><td>${r.n > 1 ? trendLabel(r.slope) : '<span class="flat">—</span>'}</td><td class="n">${r.proj == null ? "—" : r.proj + "%"}</td><td class="small">${r.time == null ? "—" : fmtTime(r.time)}</td></tr>`).join("")}</table></div>` : `<div class="empty">Nothing yet.</div>`}</div>

      o.querySelector("#cl2").onchange = e => { P.cls = e.target.value; save(); chrome(); };
      o.querySelector("#bk").onclick = () => download(`computing8_backup_${P.name.replace(/\s+/g, "_")}.json`, JSON.stringify(P), "application/json");
      o.querySelector("#rs").onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d.id || !Array.isArray(d.attempts)) throw 0; DB.profiles[d.id] = d; useProfile(d.id); close(); toast("Backup restored for " + d.name); render(); } catch (err) { toast("That file is not a backup from this site."); } }; rd.readAsText(f); };
      o.querySelector("#sw").onclick = () => { close(); DB.current = null; P = null; save(); loginModal(); };
      o.querySelector("#cls").onclick = close;
    });
  }
  function syncModal() {
    if (!P) return;
    modal(`<h2 style="font-size:22px">Saving &amp; syncing</h2>
      <p class="sub small">Your progress is always saved in this browser.</p>
      ${C.googleSheetsUrl ? `<div class="item mt"><div class="ic ${P.outbox.length ? "accent" : "good"}">${P.outbox.length ? "!" : "✓"}</div><div><div class="tt">${P.outbox.length ? P.outbox.length + " update(s) waiting to send" : "All results sent to your teacher"}</div><div class="ds">Last sent: ${P.lastSync ? fmtDT(P.lastSync) : "not yet"}</div></div></div>
        <div class="row mt"><button class="btn primary" id="sn">Sync now</button><button class="btn" id="cx">Close</button></div>` : `<div class="item mt"><div class="ic">i</div><div class="ds">Teacher sync is not switched on for this site. Use <b>My results → Export CSV</b> to send your results.</div></div><button class="btn mt" id="cx">Close</button>`}`, (o, close) => {
      const sn = o.querySelector("#sn"); if (sn) sn.onclick = () => { queueActivity(); close(); toast("Syncing…"); };
      o.querySelector("#cx").onclick = close;
    });
  }
  function afterLogin() {
    if (P.active) { const a = P.active; recordAttempt(a.quiz, a.title, a.kind, a.score, a.total, Math.round((Date.now() - new Date(a.started)) / 1000), true); toast(`Your unfinished quiz “${a.title}” was submitted: ${a.score}/${a.total}.`, 5000); }
    render(); flush();
    if (P && P.locked) showLockOverlay();
  }

  /* ================= EXAM INTEGRITY ================= */
  /* Blocks copy/paste on quiz questions, flags strong signs of outside/AI
     help during a timed quiz, sounds an alarm, and locks the student's
     profile until the teacher generates a one-time unlock key.

     IMPORTANT — read this before relying on it:
     This is a classroom deterrent, not real security. The page is plain
     client-side HTML/JS with no server, so a technically determined
     student could open devtools, read TEACHER_PASSWORD below, or just
     clear/edit this browser's localStorage to remove the lock. It will
     stop ordinary copy-pasting and casual "ask ChatGPT in another tab"
     attempts, and it gives you an audit trail (P.lockHistory) — it will
     not stop someone who specifically sets out to bypass client-side code.
     There is also no way for any browser page to truly detect "a student
     used an AI tool elsewhere" — the triggers below are proxies (copying,
     pasting, devtools shortcuts, leaving the tab) chosen because they are
     the closest observable signals, not a real AI-detector. */

  // Change this before you give the page to students — it is what lets
  // *you* open the key generator. It is read directly from this file, so
  // choose something a student would not guess, not a password you reuse.
  const TEACHER_PASSWORD = "changeme123";

  const LOCK_CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // skips 0/O/1/I so it's easy to read aloud

  function randomLockCode() {
    const pick = () => LOCK_CODE_CHARS[Math.floor(Math.random() * LOCK_CODE_CHARS.length)];
    const group = () => Array.from({ length: 4 }, pick).join("");
    return group() + "-" + group();
  }

  // A fast, reproducible string hash (djb2 variant). Not cryptography —
  // just a deterministic way to turn (lock code + your password) into a
  // key you can regenerate for the same code, but a student can't predict
  // without also knowing your password.
  function hashString(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) + h) + str.charCodeAt(i); h = h | 0; }
    return Math.abs(h);
  }
  function deriveUnlockKey(lockCode) {
    const h = hashString(String(lockCode).toUpperCase().trim() + "::" + TEACHER_PASSWORD);
    const n = h % 1000000;
    return String(n).padStart(6, "0").replace(/(\d{3})(\d{3})/, "$1-$2");
  }
  const normalizeKey = k => String(k || "").replace(/[^0-9]/g, "");

  /* ---- loud alarm (generated tone, no audio file needed) ---- */
  let audioCtx = null;
  function playAlarmSound() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      for (let i = 0; i < 4; i++) {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(i % 2 === 0 ? 880 : 660, now + i * 0.3);
        gain.gain.setValueAtTime(0.0001, now + i * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.9, now + i * 0.3 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.3 + 0.28);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.3); osc.stop(now + i * 0.3 + 0.3);
      }
    } catch (e) { /* blocked until a user gesture happens — the lock screen still shows */ }
  }

  /* ---- locking the current profile ---- */
  let lockOverlayEl = null, lockMode = "locked";

  function triggerLock(reason) {
    if (!P) return;
    if (P.locked) { showLockOverlay(); return; }
    if (QZ && !QZ.done) { try { finishQuiz(true, false); } catch (e) { } }
    const code = randomLockCode();
    P.locked = true;
    P.lockInfo = { code, reason, at: new Date().toISOString() };
    P.lockHistory = P.lockHistory || [];
    P.lockHistory.push({ code, reason, at: P.lockInfo.at });
    save();
    playAlarmSound();
    lockMode = "locked";
    showLockOverlay();
  }

  function showLockOverlay() {
    if (!lockOverlayEl) { lockOverlayEl = document.createElement("div"); lockOverlayEl.id = "lockOverlay"; document.body.appendChild(lockOverlayEl); }
    renderLockOverlay();
  }
  function hideLockOverlay() { if (lockOverlayEl) { lockOverlayEl.remove(); lockOverlayEl = null; } }

  function renderLockOverlay() {
    if (!lockOverlayEl || !P) return;

    if (lockMode === "teacherAuth") {
      lockOverlayEl.innerHTML = `<div class="lock-card">
        <div class="lock-ic">🔑</div><h2>Teacher access</h2>
        <p class="sub small">Enter the teacher password to open the key generator.</p>
        <input class="input" id="teacherPw" type="password" placeholder="Teacher password" autocomplete="off">
        <div class="row mt" style="justify-content:center"><button class="btn primary" id="pwGo">Enter</button><button class="btn" id="pwBack">← Back</button></div>
        <div class="lock-err" id="pwErr" hidden>Incorrect password.</div></div>`;
      const pwInput = lockOverlayEl.querySelector("#teacherPw"); pwInput.focus();
      const tryPw = () => { if (pwInput.value === TEACHER_PASSWORD) { lockMode = "teacherPanel"; renderLockOverlay(); } else { lockOverlayEl.querySelector("#pwErr").hidden = false; pwInput.value = ""; pwInput.focus(); } };
      lockOverlayEl.querySelector("#pwGo").onclick = tryPw;
      pwInput.onkeydown = e => { if (e.key === "Enter") tryPw(); };
      lockOverlayEl.querySelector("#pwBack").onclick = () => { lockMode = "locked"; renderLockOverlay(); };
      return;
    }

    if (lockMode === "teacherPanel") {
      const code = (P.lockInfo && P.lockInfo.code) || "";
      lockOverlayEl.innerHTML = `<div class="lock-card">
        <div class="lock-ic">🔑</div><h2>Unlock key generator</h2>
        <p class="sub small">Ask the student for the lock code on their screen, enter it below, then give them the key it generates. Every lock has a different code, so every key is different too.</p>
        <div class="field"><label for="codeIn">Student's lock code</label><input class="input" id="codeIn" value="${esc(code)}" placeholder="e.g. AB3K-7F2Q" style="text-transform:uppercase"></div>
        <button class="btn primary" id="genGo" style="width:100%">Generate unlock key</button>
        <div class="lock-key" id="genOut" hidden></div>
        <div class="row mt" style="justify-content:center"><button class="btn" id="pwBack2">← Back</button></div></div>`;
      const codeIn = lockOverlayEl.querySelector("#codeIn");
      lockOverlayEl.querySelector("#genGo").onclick = () => { const c = codeIn.value.trim().toUpperCase(); if (!c) return; const out = lockOverlayEl.querySelector("#genOut"); out.textContent = deriveUnlockKey(c); out.hidden = false; };
      lockOverlayEl.querySelector("#pwBack2").onclick = () => { lockMode = "locked"; renderLockOverlay(); };
      return;
    }

    const info = P.lockInfo || { code: "----", reason: "Profile locked." };
    lockOverlayEl.innerHTML = `<div class="lock-card">
      <div class="lock-ic">⛔</div><h2>Profile locked</h2>
      <p class="sub small">${esc(info.reason || "Suspicious activity was detected during your quiz.")}</p>
      <div class="lock-code-label">Show this code to ${esc(T)}</div>
      <div class="lock-code">${esc(info.code)}</div>
      <div class="field mt"><label for="unlockIn">Unlock key</label><input class="input" id="unlockIn" placeholder="Ask your teacher for the key" autocomplete="off" inputmode="numeric"></div>
      <button class="btn primary" id="unlockGo" style="width:100%">Unlock</button>
      <div class="lock-err" id="unlockErr" hidden>That key doesn't match. Double-check with your teacher.</div>
      <button type="button" id="teacherLink" class="lock-teacher-link">🔑 Teacher access</button></div>`;
    const unlockIn = lockOverlayEl.querySelector("#unlockIn"); unlockIn.focus();
    const tryUnlock = () => {
      const expected = deriveUnlockKey(info.code);
      if (normalizeKey(unlockIn.value) === normalizeKey(expected)) {
        P.locked = false;
        if (P.lockHistory && P.lockHistory.length) P.lockHistory[P.lockHistory.length - 1].unlockedAt = new Date().toISOString();
        save(); hideLockOverlay(); toast("Profile unlocked. Welcome back!"); render();
      } else {
        lockOverlayEl.querySelector("#unlockErr").hidden = false;
        const card = lockOverlayEl.querySelector(".lock-card");
        card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
        unlockIn.value = ""; unlockIn.focus();
      }
    };
    lockOverlayEl.querySelector("#unlockGo").onclick = tryUnlock;
    unlockIn.onkeydown = e => { if (e.key === "Enter") tryUnlock(); };
    lockOverlayEl.querySelector("#teacherLink").onclick = () => { lockMode = "teacherAuth"; renderLockOverlay(); };
  }

  /* ---- detecting likely cheating during an active quiz ---- */
  let tabSwitchWarned = false;
  const isQuizActive = () => !!(QZ && !QZ.done);

  document.addEventListener("copy", e => { if (isQuizActive()) { e.preventDefault(); triggerLock("Copying the quiz questions is not allowed."); } });
  document.addEventListener("cut", e => { if (isQuizActive()) { e.preventDefault(); triggerLock("Cutting quiz content is not allowed."); } });
  document.addEventListener("paste", e => { if (isQuizActive()) { e.preventDefault(); triggerLock("Pasted text was detected in your answer — outside help, including AI tools, is not allowed during a quiz."); } });
  document.addEventListener("contextmenu", e => { if (isQuizActive()) e.preventDefault(); });
  document.addEventListener("keydown", e => {
    if (!isQuizActive()) return;
    const k = e.key.toLowerCase(), combo = e.ctrlKey || e.metaKey;
    if (combo && (k === "c" || k === "x" || k === "v")) { e.preventDefault(); triggerLock("A copy/paste keyboard shortcut was used during a quiz."); return; }
    if (k === "f12" || (combo && e.shiftKey && (k === "i" || k === "j" || k === "c")) || (combo && k === "u")) { e.preventDefault(); triggerLock("Developer tools were opened during a quiz."); }
  });
  document.addEventListener("visibilitychange", () => {
    if (!isQuizActive() || document.visibilityState !== "hidden") return;
    if (!tabSwitchWarned) { tabSwitchWarned = true; toast("⚠ Stay on this tab during the quiz — leaving it again will lock your profile.", 4500); }
    else { triggerLock("Left the quiz tab or window more than once during a timed question."); }
  });

  /* ---------------- init ---------------- */
  if (DB.current && DB.profiles[DB.current]) { useProfile(DB.current); afterLogin(); } else { chrome("home"); loginModal(); }
  if (P && P.locked) showLockOverlay();
  window.__app = { buildQuestions, TOPICS, schedule }; // for testing
})();

</script>
</body>
</html>
