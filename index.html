<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade 8 Computing · Mr. Gilbert</title>
  <meta name="description" content="Grade 8 Computing with Mr. Gilbert — topics, weekly plan, quizzes, assessments and your personal progress tracker.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
/* Grade 8 Computing with Mr. Gilbert — student-friendly theme */
:root {
  --navy: #1b3a6b;          /* primary navy */
  --navy-d: #0f2347;
  --navy-l: #3b5f9a;
  --gold: #e3b341;
  --gold-l: #f6d77a;
  --gold-d: #a87908;
  --ink: #16213a;
  --ink-2: #4c5873;
  --muted: #8790a6;
  --accent: #a87908;        /* gold text on white */
  --accent-l: #fdf4dc;
  --mint: #16b981;
  --sun: #e3b341;
  --sky: #3b5f9a;
  --pink: #c9962a;
  --cream: #fff8e8;
  --cream-b: #f3d27a;
  --bg: #0d1d3a;
  --card: #ffffff;
  --line: #e6e9f1;
  --chip: #eaf0fa;
  --good: #128a5e;
  --good-l: #e2f6ec;
  --bad: #c9354f;
  --bad-l: #fde8ec;
  --warn: #9a6a00;
  --warn-l: #fff3d6;
  --radius: 20px;
  --shadow: 0 2px 4px rgba(5, 15, 40, .08), 0 12px 30px rgba(5, 15, 40, .18);
  --head: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --sans: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --on-bg: #eef2fb;
  --on-bg-2: #b7c3de;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans); color: var(--ink); font-size: 16px; line-height: 1.55;
  background:
    radial-gradient(900px 500px at 105% -10%, #ffe3f1 0, transparent 60%),
    radial-gradient(800px 500px at 30% 110%, #dff7ff 0, transparent 60%),
    radial-gradient(700px 420px at -10% 20%, #ece7ff 0, transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
a { color: var(--navy); }
button { font-family: inherit; }
h1, h2, h3, h4 { font-family: var(--head); color: var(--ink); margin: 0; line-height: 1.2; font-weight: 600; }
code { font-family: var(--mono); background: var(--chip); padding: 1px 6px; border-radius: 6px; font-size: .88em; color: var(--navy-d); }

/* ---------- layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 250px; color: #fff; display: flex; flex-direction: column; position: fixed; inset: 14px auto 14px 14px; z-index: 30;
  background: linear-gradient(165deg, #5b4ee6 0%, #7c4ddf 55%, #a24fd0 100%);
  border-radius: 26px; box-shadow: 0 14px 40px rgba(75, 63, 214, .3); transition: transform .25s; overflow-y: auto;
}
.brand { display: flex; gap: 12px; align-items: center; padding: 22px 18px 16px; }
.brand-logo { width: 54px; height: 54px; border-radius: 50%; background: #fff; overflow: hidden; flex: none; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
.brand-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-name { font-family: var(--head); font-size: 21px; font-weight: 600; line-height: 1.1; }
.brand-sub { font-size: 13px; opacity: .85; margin-top: 2px; }
.sem-toggle { display: flex; gap: 4px; margin: 4px 16px 16px; background: rgba(255,255,255,.16); border-radius: 14px; padding: 4px; }
.sem-toggle button { flex: 1; border: 0; background: transparent; color: #fff; padding: 8px 4px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; opacity: .85; }
.sem-toggle button.on { background: #fff; color: var(--navy); opacity: 1; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
nav.menu { display: flex; flex-direction: column; gap: 3px; padding: 0 12px; }
nav.menu a { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; padding: 11px 14px; border-radius: 14px; font-size: 15.5px; font-weight: 700; transition: background .15s; }
nav.menu a .k { width: 22px; font-size: 18px; text-align: center; }
nav.menu a:hover { background: rgba(255,255,255,.14); }
nav.menu a.on { background: #fff; color: var(--navy); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.side-foot { margin: auto 14px 14px; background: rgba(255,255,255,.14); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.side-foot:hover { background: rgba(255,255,255,.22); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--sun); color: #4a2a00; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.side-foot .who { font-weight: 800; font-size: 14px; }
.side-foot .role { font-size: 12px; opacity: .8; }

.main { margin-left: 278px; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 18px 32px 0; }
.crumb { font-weight: 700; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.icon-btn { width: 40px; height: 40px; border-radius: 14px; border: 0; background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--navy); position: relative; font-size: 17px; box-shadow: var(--shadow); }
.icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.hamburger { display: none; }
.content { padding: 22px 32px 30px; max-width: 1120px; width: 100%; margin: 0 auto; flex: 1; }
.signature { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ink-2); font-size: 14px; padding: 10px 16px 30px; }
.signature img { width: 34px; height: 34px; border-radius: 50%; background: #fff; box-shadow: var(--shadow); }
.signature b { color: var(--navy); }

/* ---------- typography blocks ---------- */
.eyebrow { color: var(--accent); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
.h-xl { font-size: clamp(30px, 4.6vw, 44px); margin-top: 4px; }
.h-lg { font-size: 25px; margin-top: 2px; }
.h-md { font-size: 20px; }
.sub { color: var(--ink-2); margin-top: 6px; }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); color: var(--navy); font-size: 12.5px; font-weight: 800; padding: 6px 12px; border-radius: 99px; white-space: nowrap; }
.tag.sm { font-size: 11.5px; padding: 4px 10px; }
.tag.good { background: var(--good-l); color: var(--good); }
.tag.bad { background: var(--bad-l); color: var(--bad); }
.tag.warn { background: var(--warn-l); color: var(--warn); }
.tag.accent { background: var(--accent-l); color: var(--accent); }
.section { margin-top: 30px; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.link { color: var(--navy); font-weight: 800; text-decoration: none; font-size: 15px; cursor: pointer; background: none; border: 0; padding: 0; }
.link:hover { text-decoration: underline; }
.lbl { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }

/* ---------- cards ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.card.top { border-top: 0; }
.bubble-wrap { display: flex; gap: 14px; align-items: flex-end; max-width: 760px; }
.bubble-face { width: 72px; height: 72px; border-radius: 50%; background: #fff; box-shadow: var(--shadow); flex: none; overflow: hidden; }
.bubble-face img { width: 100%; height: 100%; object-fit: cover; }
.bubble { position: relative; background: #fff; border-radius: 22px 22px 22px 6px; padding: 16px 20px; box-shadow: var(--shadow); flex: 1; }
.bubble .who { font-family: var(--head); font-weight: 600; color: var(--navy); font-size: 16px; }
.bubble p { margin: 4px 0 0; color: var(--ink-2); font-size: 15.5px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.stat { padding: 18px 20px; position: relative; overflow: hidden; }
.stat::after { content: ""; position: absolute; right: -24px; top: -24px; width: 90px; height: 90px; border-radius: 50%; background: var(--chip); opacity: .7; }
.stat.c2::after { background: var(--accent-l); } .stat.c3::after { background: var(--good-l); } .stat.c4::after { background: var(--warn-l); }
.stat .ico { font-size: 24px; position: relative; z-index: 1; }
.stat .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; position: relative; z-index: 1; }
.stat .lbl { color: var(--ink-2); font-size: 11.5px; }
.stat .num { font-family: var(--head); font-size: 34px; font-weight: 600; color: var(--ink); margin: 8px 0 2px; line-height: 1; }
.stat .cap { color: var(--ink-2); font-size: 13.5px; }
.stat .link { font-size: 13px; white-space: nowrap; }

/* to-do */
.task-row { display: flex; gap: 10px; margin: 16px 0; }
.input { flex: 1; border: 2px solid var(--line); border-radius: 14px; padding: 11px 14px; font-size: 15px; font-family: inherit; background: #fff; color: var(--ink); min-width: 0; }
.input:focus { outline: none; border-color: var(--navy-l); box-shadow: 0 0 0 4px rgba(122,111,240,.15); }
.btn { border: 2px solid var(--line); background: #fff; color: var(--navy); font-weight: 800; padding: 10px 18px; border-radius: 14px; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; justify-content: center; transition: transform .1s, box-shadow .15s, background .15s; }
.btn:hover { border-color: var(--navy-l); transform: translateY(-1px); }
.btn.primary { background: linear-gradient(135deg, #5b4ee6, #8b5cf6); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(91,78,230,.3); }
.btn.accent { background: linear-gradient(135deg, #ff6b4a, #ff8f5a); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(255,107,74,.28); }
.btn.sm { padding: 6px 12px; font-size: 13.5px; border-radius: 11px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; background: #faf9ff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.item .ic { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: var(--chip); color: var(--navy); font-size: 16px; flex: none; font-weight: 800; }
.item .ic.accent { background: var(--accent-l); color: var(--accent); }
.item .ic.good { background: var(--good-l); color: var(--good); }
.item .tt { font-weight: 800; font-size: 14.5px; }
.item .ds { font-size: 13.5px; color: var(--ink-2); }
.item .act { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.item.done .tt { text-decoration: line-through; opacity: .6; }
.more-btn { width: 100%; margin-top: 4px; }
.count-badge { min-width: 40px; height: 40px; padding: 0 10px; border-radius: 14px; background: linear-gradient(135deg, #ff6b4a, #ff8f5a); display: grid; place-items: center; font-family: var(--head); font-weight: 600; color: #fff; font-size: 18px; }
.chk { width: 22px; height: 22px; accent-color: var(--navy); cursor: pointer; flex: none; }

/* this-week card */
.now { background: linear-gradient(135deg, #2f9bff 0%, #5b4ee6 60%, #8b5cf6 100%); color: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 14px 34px rgba(75,63,214,.25); }
.now-head { display: flex; gap: 14px; align-items: center; padding: 20px 20px 14px; }
.now-badge { width: 60px; height: 60px; border-radius: 18px; background: rgba(255,255,255,.2); display: grid; place-items: center; font-family: var(--head); font-size: 22px; font-weight: 600; flex: none; }
.now .lbl { color: #fff; opacity: .85; font-size: 11.5px; }
.now h3 { color: #fff; font-size: 22px; margin-top: 2px; }
.now-body { background: rgba(255,255,255,.12); margin: 0 12px 12px; border-radius: 18px; padding: 4px 14px; }
.now-topic { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.18); flex-wrap: wrap; }
.now-topic:last-child { border-bottom: 0; }
.now-topic .code { font-family: var(--mono); font-size: 12px; opacity: .85; width: 56px; flex: none; }
.now-topic .nm { flex: 1; font-weight: 800; min-width: 140px; }
.now .tag { background: rgba(255,255,255,.92); }
.now a.btn { background: #fff; color: var(--navy); border-color: transparent; }

/* ---------- weekly plan ---------- */
.week { background: #fff; border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow); border: 2px solid transparent; }
.week.current { border-color: var(--navy-l); }
.week-h { display: flex; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; flex-wrap: wrap; }
.week-n { font-family: var(--head); font-weight: 600; font-size: 17px; color: #fff; background: linear-gradient(135deg, #5b4ee6, #8b5cf6); border-radius: 14px; padding: 8px 12px; flex: none; min-width: 84px; text-align: center; }
.week-d { color: var(--ink-2); font-size: 14px; flex: 1; min-width: 150px; }
.week-d b { color: var(--ink); }
.week-b { display: none; border-top: 1px solid var(--line); padding: 4px 18px 14px; }
.week.open .week-b { display: block; }
.trow { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.trow:last-child { border-bottom: 0; }
.trow .code { font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 700; }
.trow .nm { font-weight: 800; }
.trow .ob { font-size: 12.5px; color: var(--muted); }
.trow .acts { display: flex; gap: 6px; }
.progress { height: 10px; background: var(--chip); border-radius: 99px; overflow: hidden; width: 120px; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, #16b981, #2f9bff); border-radius: 99px; }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cal-head h3 { flex: 1; font-size: 22px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; padding: 4px 6px; }
.cal .day { min-height: 92px; background: #faf9ff; border: 1px solid var(--line); border-radius: 12px; padding: 6px; font-size: 12px; overflow: hidden; }
.cal .day.out { background: transparent; border-color: transparent; }
.cal .day.today { border: 2px solid var(--accent); background: #fff; }
.cal .day .dn { font-weight: 800; font-size: 13px; color: var(--ink-2); }
.ev { display: block; border-radius: 8px; padding: 3px 7px; margin-top: 3px; font-size: 11.5px; line-height: 1.3; font-weight: 800; text-decoration: none; cursor: pointer; border: 0; text-align: left; width: 100%; }
.ev.topic { background: var(--chip); color: var(--navy); }
.ev.spot { background: var(--accent-l); color: #d4502f; }
.ev.unit { background: var(--accent); color: #fff; }
.ev.done { background: var(--good-l); color: var(--good); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

/* ---------- resources ---------- */
.search { max-width: 440px; }
.unit-card { margin-bottom: 18px; }
.unit-card .uh { display: flex; gap: 14px; align-items: center; }
.unit-num { width: 52px; height: 52px; border-radius: 16px; color: #fff; display: grid; place-items: center; font-family: var(--head); font-weight: 600; font-size: 22px; flex: none; background: linear-gradient(135deg, #5b4ee6, #8b5cf6); }
.unit-num.u2 { background: linear-gradient(135deg, #ff6b4a, #ffa25a); }
.unit-num.u3 { background: linear-gradient(135deg, #10b981, #34d3a0); }
.unit-num.u4 { background: linear-gradient(135deg, #2f9bff, #5ec2ff); }
.unit-num.u5 { background: linear-gradient(135deg, #f0569b, #ff8cc0); }
.unit-num.u6 { background: linear-gradient(135deg, #f59e0b, #ffc94a); }
.topic-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
.tcard { border: 2px solid var(--line); border-radius: 16px; padding: 14px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; background: #fff; transition: border-color .15s, transform .15s, box-shadow .15s; }
.tcard:hover { border-color: var(--navy-l); transform: translateY(-2px); box-shadow: var(--shadow); }
.tcard .code { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 700; }
.tcard .nm { font-weight: 800; color: var(--ink); line-height: 1.3; }
.tcard .ds { font-size: 13.5px; color: var(--ink-2); flex: 1; }
.tcard .ft { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.reader { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 22px; align-items: start; }
.reading { font-size: 17px; line-height: 1.7; padding: 28px; }
.reading h4 { font-size: 20px; margin: 26px 0 8px; color: var(--navy); }
.reading p { margin: 10px 0; }
.reading ul, .reading ol { padding-left: 22px; }
.reading li { margin: 5px 0; }
.reading ul.check { list-style: none; padding-left: 0; }
.reading ul.check li::before { content: "☐"; margin-right: 8px; color: var(--accent); }
pre.code, .q-code { background: #1e1b3a; color: #eceaff; padding: 14px 16px; border-radius: 14px; overflow-x: auto; font-family: var(--mono); font-size: 14px; line-height: 1.6; margin: 12px 0; white-space: pre; }
.tbl { border-collapse: separate; border-spacing: 0; width: 100%; margin: 12px 0; font-size: 15px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.tbl tr > :last-child { border-right: 0; }
.tbl tr:last-child > * { border-bottom: 0; }
.tbl th { background: var(--chip); color: var(--navy-d); font-weight: 800; }
.tbl.mono td { font-family: var(--mono); text-align: center; }
.tbl td.hl { background: var(--accent-l); color: var(--accent); font-weight: 800; }
.table-wrap { overflow-x: auto; }
.tip { background: var(--warn-l); border-radius: 14px; padding: 12px 16px; margin: 16px 0; font-size: 15.5px; }
.tip::before { content: "💡 "; }
.keywords { background: var(--chip); padding: 12px 16px; border-radius: 14px; margin-top: 22px; font-size: 15px; }
.topo-row { display: flex; gap: 10px; flex-wrap: wrap; color: var(--navy); }
.topo { width: 160px; height: 90px; background: var(--bg); border-radius: 12px; padding: 4px; }
.side-panel { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; }
.obj { display: flex; gap: 10px; font-size: 14px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.obj:last-child { border-bottom: 0; }
.obj b { font-family: var(--mono); color: var(--accent); font-size: 12.5px; white-space: nowrap; }
.banner { padding: 12px 16px; border-radius: 14px; background: #ffe9f3; color: #b0306a; font-weight: 700; margin-bottom: 16px; }

/* ---------- quiz ---------- */
.quiz-wrap { max-width: 780px; margin: 0 auto; }
.quiz-top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.qprog { flex: 1; min-width: 0; }
.qprog .bar { height: 12px; background: #fff; border-radius: 99px; overflow: hidden; margin-top: 8px; box-shadow: inset 0 0 0 1px var(--line); }
.qprog .bar i { display: block; height: 100%; background: linear-gradient(90deg, #5b4ee6, #f0569b); transition: width .3s; border-radius: 99px; }
.timer { width: 72px; height: 72px; position: relative; flex: none; background: #fff; border-radius: 50%; box-shadow: var(--shadow); }
.timer svg { transform: rotate(-90deg); position: absolute; inset: 1px; }
.timer .tnum { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--head); font-weight: 600; font-size: 23px; color: var(--navy); }
.timer.low .tnum { color: var(--bad); }
.timer.low { animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.qcard { padding: 28px; }
.qtype { margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.qtext { font-size: 21px; font-weight: 800; line-height: 1.4; color: var(--ink); }
.proposed { margin-top: 14px; background: var(--chip); padding: 14px 18px; border-radius: 14px; font-size: 17px; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.opt { text-align: left; border: 2px solid var(--line); background: #fff; padding: 13px 16px; border-radius: 16px; cursor: pointer; font-size: 16px; color: var(--ink); display: flex; gap: 12px; align-items: flex-start; white-space: pre-wrap; font-family: inherit; font-weight: 600; transition: border-color .12s, background .12s, transform .1s; }
.opt .ltr { width: 28px; height: 28px; border-radius: 10px; background: var(--chip); color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.opt:hover:not(:disabled) { border-color: var(--navy-l); transform: translateX(2px); }
.opt.sel { border-color: var(--navy); background: #f1efff; }
.opt.sel .ltr { background: var(--navy); color: #fff; }
.opt.right { border-color: var(--good); background: var(--good-l); }
.opt.right .ltr { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-l); }
.opt.wrong .ltr { background: var(--bad); color: #fff; }
.opt:disabled { cursor: default; }
b.codey, .opt code, .opt.codey { font-family: var(--mono); font-size: 14px; }

/* ---------- exam integrity: block copy/paste of quiz content ---------- */
.qcard, .qtext, .q-code, .opts, .proposed, .match { user-select: none; -webkit-user-select: none; -moz-user-select: none; }
.qcard input, .qcard select, .qcard textarea { user-select: text; -webkit-user-select: text; }

/* ---------- exam integrity: lock screen ---------- */
#lockOverlay { position: fixed; inset: 0; z-index: 999999; background: linear-gradient(160deg, rgba(10,6,30,.97), rgba(50,10,22,.97)); backdrop-filter: blur(10px); display: grid; place-items: center; padding: 20px; }
.lock-card { background: #fff; border-radius: 26px; max-width: 440px; width: 100%; padding: 32px 28px; text-align: center; box-shadow: 0 30px 90px rgba(0,0,0,.55); border: 4px solid var(--bad); }
.lock-ic { font-size: 48px; line-height: 1; margin-bottom: 4px; }
.lock-card h2 { font-size: 24px; color: var(--bad); margin-bottom: 4px; }
.lock-card .sub { color: var(--ink-2); }
.lock-code-label { margin-top: 18px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.lock-code { font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: .06em; color: var(--navy-d); background: var(--chip); border-radius: 12px; padding: 10px 14px; margin-top: 6px; user-select: text; -webkit-user-select: text; }
.lock-err { color: var(--bad); font-size: 13px; font-weight: 700; margin-top: 10px; }
.lock-key { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: .05em; color: var(--good); background: var(--good-l); border-radius: 12px; padding: 10px 14px; margin-top: 14px; user-select: text; -webkit-user-select: text; }
.lock-teacher-link { display: inline-block; margin-top: 20px; font-size: 12px; color: var(--ink-2); text-decoration: underline; cursor: pointer; background: none; border: none; }
.lock-card.shake { animation: lockShake .4s; }
@keyframes lockShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
.tf { flex-direction: row; }
.tf .opt { flex: 1; justify-content: center; font-weight: 800; font-size: 18px; }
.typed { margin-top: 18px; display: flex; gap: 10px; }
.typed .input { font-size: 18px; }
.match { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 12px; align-items: center; background: #faf9ff; border: 1px solid var(--line); padding: 10px 12px; border-radius: 14px; font-weight: 600; }
.mrow select { padding: 9px; border-radius: 10px; border: 2px solid var(--line); font-size: 14.5px; font-family: inherit; background: #fff; width: 100%; }
.mrow.right { background: var(--good-l); } .mrow.wrong { background: var(--bad-l); }
.feedback { margin-top: 18px; padding: 14px 16px; border-radius: 14px; font-size: 15.5px; }
.feedback.good { background: var(--good-l); color: #0b6b49; }
.feedback.bad { background: var(--bad-l); color: #9a2340; }
.qfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 12px; flex-wrap: wrap; }
.qfoot .hint { color: var(--muted); font-size: 13.5px; }
.score-hero { text-align: center; padding: 34px 24px; }
.score-face { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; margin: 0 auto 6px; background: #fff; box-shadow: var(--shadow); }
.score-face img { width: 100%; height: 100%; object-fit: cover; }
.score-big { font-family: var(--head); font-size: 68px; font-weight: 600; line-height: 1; margin: 10px 0; background: linear-gradient(135deg, #5b4ee6, #f0569b); -webkit-background-clip: text; background-clip: text; color: transparent; }
.review-item { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.review-item .q { font-weight: 700; }
.review-item .a { color: var(--ink-2); margin-top: 4px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- results ---------- */
.chart-card { padding: 22px; }
.chart-card svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
select.input { flex: none; padding: 8px 12px; font-size: 14.5px; max-width: 100%; }
.tooltip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; font-size: 13px; padding: 7px 10px; border-radius: 10px; z-index: 100; display: none; max-width: 240px; line-height: 1.35; }
.data-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.data-table th { text-align: left; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.data-table td { padding: 10px; border-bottom: 1px solid var(--line); }
.data-table td.n { font-variant-numeric: tabular-nums; }
.up { color: var(--good); font-weight: 800; } .down { color: var(--bad); font-weight: 800; } .flat { color: var(--muted); font-weight: 800; }

/* ---------- login / modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(35, 25, 90, .45); backdrop-filter: blur(4px); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; border-radius: 26px; max-width: 460px; width: 100%; padding: 28px; box-shadow: 0 30px 80px rgba(40,20,120,.3); max-height: 92vh; overflow-y: auto; }
.modal h2 { font-size: 26px; }
.welcome-face { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; margin: -4px auto 10px; box-shadow: 0 0 0 5px var(--chip); }
.welcome-face img { width: 100%; height: 100%; object-fit: cover; }
.field { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 800; color: var(--ink-2); }
.profile-btn { display: flex; gap: 12px; align-items: center; width: 100%; border: 2px solid var(--line); background: #fff; padding: 10px 12px; border-radius: 14px; cursor: pointer; margin-top: 8px; text-align: left; font-size: 15px; }
.profile-btn:hover { border-color: var(--navy); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; z-index: 120; font-size: 14.5px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.empty { text-align: center; color: var(--ink-2); padding: 30px 10px; }
.help h4 { margin-top: 22px; font-size: 19px; color: var(--navy); }
.help p, .help li { color: var(--ink-2); }
.mt { margin-top: 16px; } .mt-s { margin-top: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); } .small { font-size: 13.5px; }

/* ---------- responsive ---------- */
@media (max-width: 1000px) {
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reader { grid-template-columns: minmax(0, 1fr); }
  .side-panel { position: static; }
}
@media (max-width: 760px) {
  .sidebar { transform: translateX(-120%); inset: 8px auto 8px 8px; }
  .sidebar.open { transform: none; }
  .main { margin-left: 0; }
  .hamburger { display: grid; }
  .topbar { padding: 12px 16px 0; }
  .content { padding: 16px 16px 24px; }
  .grid3, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat .head { flex-direction: column; gap: 2px; }
  .stat { padding: 14px; }
  .bubble-face { width: 54px; height: 54px; }
  .trow { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .cal { gap: 3px; }
  .cal .day { min-height: 58px; padding: 4px; border-radius: 8px; }
  .cal .ev { font-size: 0; height: 6px; padding: 0; }
  .mrow { grid-template-columns: minmax(0, 1fr); }
  .qcard, .reading { padding: 18px; }
  .qtext { font-size: 18px; }
  .stat .num { font-size: 28px; }
}
@media print {
  .sidebar, .topbar, .btn, .no-print, .signature { display: none !important; }
  .main { margin: 0; }
  body { background: #fff; }
  .card { box-shadow: none; border: 1px solid #ddd; }
}


/* =================== NAVY & GOLD THEME =================== */
body {
  color: var(--on-bg);
  background:
    radial-gradient(900px 520px at 100% -5%, rgba(227, 179, 65, .30) 0, transparent 60%),
    radial-gradient(700px 480px at 15% 105%, rgba(227, 179, 65, .18) 0, transparent 60%),
    radial-gradient(900px 600px at 0% 0%, #1d3d72 0, transparent 65%),
    linear-gradient(160deg, #10254a 0%, #0b1a35 55%, #0a1630 100%);
  background-attachment: fixed;
}
h1, h2, h3, h4 { color: inherit; }
.content, .topbar, .signature { color: var(--on-bg); }

.eyebrow { color: var(--gold); }
.link { color: var(--gold-l); }
.crumb { color: var(--on-bg-2); }

/* cards keep dark text on white */
.card, .week, .tcard, .item, .modal, .bubble, .tooltip ~ * .card { color: var(--ink); }

.card .link, .modal .link, .week .link { color: var(--navy); }

.card { border-top: 3px solid var(--gold); }

/* quiz */

.qprog .bar i { background: linear-gradient(90deg, var(--gold), var(--gold-l)); }
.timer { box-shadow: 0 0 0 3px var(--gold); }
.opt.sel { border-color: var(--navy); background: #eef3fb; }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.score-big { background: linear-gradient(135deg, var(--navy), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.overlay { background: rgba(5, 12, 30, .6); }
.toast { background: var(--navy-d); border: 1px solid var(--gold); }
html { background: #0b1a35; }

/* ---------- videos ---------- */

.vsection .btn.sm { white-space: nowrap; }

  summary: "Every piece of data in a program has a type. Algorithms can be planned as flowcharts or pseudocode.",
  reading: `
<p>A <b>chatbot</b> is a program that has a conversation with a user. It asks questions, stores the answers and replies. To do that, it must store <b>data</b> — and every piece of data has a <b>data type</b>.</p>
<h4>The five data types you must know</h4>
<table class="tbl"><tr><th>Data type</th><th>What it stores</th><th>Examples</th></tr>
<tr><td><b>Integer</b></td><td>Whole numbers (no decimal point)</td><td>14, 0, -3</td></tr>
<tr><td><b>Real</b> (float in Python)</td><td>Numbers with a decimal point</td><td>3.14, 1.5, -0.25</td></tr>

<tr><td><b>String</b></td><td>Text — a group of characters</td><td>"Hello", "8B", "07700 900123"</td></tr>
<tr><td><b>Boolean</b></td><td>Only two values: True or False</td><td>True, False</td></tr></table>
<div class="tip"><b>Watch out!</b> A phone number is stored as a <b>string</b>, not an integer — you never do maths with it and it may start with 0.</div>
<h4>Collecting data in Python</h4>
<p><code>input()</code> always gives back a <b>string</b>. If you need a number, convert it:</p>
<pre class="code">name = input("What is your name? ")        # string
age = int(input("How old are you? "))       # integer

  reading: `
<p>Programmers rarely write a whole program in one go. Instead they use <b>iterative development</b>: build a little, test it, improve it, and repeat. Each repeat is called an <b>iteration</b>.</p>
<h4>What is a prototype?</h4>
<p>A <b>prototype</b> is an early, simple version of a program. It does not have every feature yet, but it works well enough to test and show to users.</p>
<h4>The cycle</h4>
<ol><li><b>Plan</b> — decide what this version should do.</li>
<li><b>Design</b> — draw a flowchart or write pseudocode.</li>
<li><b>Code</b> — write the program.</li>
<li><b>Test</b> — run it, find errors, get feedback from users.</li>
<li><b>Review / evaluate</b> — decide what to fix or add next. Then go back to step 1.</li></ol>
<h4>Example: a chatbot</h4>
<ul><li><b>Version 1:</b> asks the user's name and says hello.</li>
<li><b>Version 2:</b> also asks their age and replies differently for different ages.</li>
<li><b>Version 3:</b> remembers a list of favourite hobbies and asks about each one.</li></ul>
<h4>Why work this way?</h4>
<ul><li>Errors are found early, when they are small and easy to fix.</li>
<li>Users can give feedback on each version.</li>
<li>You always have a working program to show.</li>
<li>It is easier to change your plans if needs change.</li></ul>
<div class="tip">Save each version with a new name (chatbot_v1.py, chatbot_v2.py…) so you can go back if something breaks.</div>
<div class="keywords"><b>Key words:</b> iterative development, iteration, prototype, feedback, version, evaluate</div>`

{

<p>A <b>trace table</b> helps you follow a program step by step — like being the computer. You write down the value of every variable each time it changes. This is called <b>dry running</b> and it is a great way to find bugs.</p>
<h4>How to make a trace table</h4>
<ol><li>Make one column for each variable (and one for output).</li>
<li>Go through the code one line at a time.</li>
<li>Each time a variable changes, write its new value on a new row.</li>
<li>Compare the results to what you <i>expected</i>. Where they differ, there is a bug.</li></ol>
<h4>Example</h4>
<pre class="code">total = 0
for count in range(1, 4):
    total = total + count
print(total)</pre>
<table class="tbl"><tr><th>count</th><th>total</th><th>output</th></tr>
<tr><td>–</td><td>0</td><td></td></tr><tr><td>1</td><td>1</td><td></td></tr><tr><td>2</td><td>3</td><td></td></tr><tr><td>3</td><td>6</td><td></td></tr><tr><td></td><td></td><td>6</td></tr></table>
<div class="tip"><code>range(1, 4)</code> gives 1, 2, 3 — it stops <b>before</b> 4.</div>
<h4>Why use them?</h4>
<ul><li>They show exactly where a program goes wrong.</li><li>You can test code on paper, without a computer.</li><li>They are especially useful for <b>logic errors</b>, where the program runs but gives the wrong answer.</li></ul>
<div class="keywords"><b>Key words:</b> trace table, dry run, variable, debug, logic error, systematic</div>`
},
{

  summary: "Syntax, logic and runtime errors — what they are and how to find and fix them.",
  reading: `
<p>An <b>error</b> (or <b>bug</b>) is a mistake in a program. Finding and fixing them is called <b>debugging</b>. There are three main types.</p>
<table class="tbl"><tr><th>Error</th><th>What it means</th><th>Example</th></tr>
<tr><td><b>Syntax error</b></td><td>Breaks the rules of the language, so the program will not run at all.</td><td><code>print("Hi"</code> — missing bracket; <code>prnt("Hi")</code> — spelling</td></tr>
<tr><td><b>Logic error</b></td><td>The program runs but gives the wrong result.</td><td><code>average = a + b / 2</code> (should be <code>(a + b) / 2</code>)</td></tr>
<tr><td><b>Runtime error</b></td><td>The program starts but crashes while it is running.</td><td>Dividing by zero; <code>int("hello")</code>; reading a list item that doesn't exist</td></tr></table>
<h4>Spotting them</h4>
<ul><li><b>Syntax</b>: Python shows a SyntaxError before anything runs. Look for missing brackets, colons, quotes or wrong indentation.</li>
<li><b>Runtime</b>: Python shows an error message (e.g. ZeroDivisionError, ValueError, IndexError) part-way through.</li>
<li><b>Logic</b>: no message! You only notice because the answer is wrong. Use a <b>trace table</b> and test data to find it.</li></ul>
<pre class="code">age = int(input("Age: "))
if age > 13:          # logic error? 13-year-olds are teenagers too!
    print("Teenager")</pre>
<p>Should be <code>age >= 13</code>. The program runs, so this is a logic error.</p>
<div class="tip">Fix one error at a time, then test again — that is iterative development.</div>
<div class="keywords"><b>Key words:</b> bug, debugging, syntax error, logic error, runtime error, error message</div>`
},
{

  summary: "Count-controlled loops repeat code a set number of times. Predict and compare looping algorithms.",

<p><b>Iteration</b> means repeating. A <b>count-controlled loop</b> repeats a set number of times — you know in advance how many.</p>
<h4>In pseudocode</h4>
<pre class="code">FOR Counter ← 1 TO 5
    OUTPUT "Hello"
NEXT Counter</pre>
<h4>In Python</h4>
<pre class="code">for counter in range(1, 6):   # 1, 2, 3, 4, 5

<ul><li><code>range(5)</code> → 0, 1, 2, 3, 4 (5 times)</li>
<li><code>range(1, 6)</code> → 1 to 5</li>
<li><code>range(2, 11, 2)</code> → 2, 4, 6, 8, 10 (the third number is the <b>step</b>)</li></ul>
<h4>In a flowchart</h4>
<p>A loop is drawn with a <b>decision diamond</b> (e.g. "Is counter > 5?") and an arrow that goes <b>back up</b> to repeat the steps. Inside the loop, the counter is increased by 1 each time.</p>
<h4>Predicting the outcome</h4>
<pre class="code">x = 1
for i in range(3):

print(x)   # 1 → 2 → 4 → 8, prints 8</pre>
<h4>Comparing algorithms</h4>
<p>Two algorithms can solve the same task. Which is best? Ask:</p>
<ul><li>Does it give the <b>correct</b> result every time?</li>
<li>Is it <b>efficient</b> — fewer steps / less code?</li>
<li>Is it <b>easy to read</b> and change? (e.g. 1 loop instead of 10 copied print lines)</li></ul>
<div class="keywords"><b>Key words:</b> iteration, loop, count-controlled, FOR, NEXT, range, step, efficient</div>`
},
{

<p>An <b>array</b> is a data structure that stores <b>many values under one name</b>. In Python we use a <b>list</b>. A <b>one-dimensional</b> array is a single row of items.</p>
<h4>Why use an array?</h4>
<p>Instead of 30 variables (score1, score2 … score30) you have one array <code>scores</code>. It is shorter, neater and works with loops.</p>
<pre class="code">hobbies = ["football", "music", "gaming", "art"]
#  index:      0          1        2       3</pre>
<h4>Accessing data with an index</h4>
<ul><li>Each item has a position number called an <b>index</b>.</li>
<li>Indexes start at <b>0</b>! <code>hobbies[0]</code> is "football", <code>hobbies[3]</code> is "art".</li>
<li><code>hobbies[4]</code> would cause an <b>IndexError</b> (runtime error) — there is no item 4.</li>
<li><code>len(hobbies)</code> gives the number of items: 4.</li>
<li>Change an item: <code>hobbies[1] = "dance"</code></li></ul>
<h4>Loops + arrays</h4>
<pre class="code">for i in range(len(hobbies)):
    print("Do you like", hobbies[i], "?")</pre>
<p>The loop counter <code>i</code> goes 0, 1, 2, 3 and is used as the index.</p>
<h4>In pseudocode</h4>
<pre class="code">FOR i ← 0 TO 3
    OUTPUT Hobbies[i]
NEXT i</pre>
<div class="keywords"><b>Key words:</b> array, list, one-dimensional, index, element, len, IndexError</div>`

{

  reading: `
<p>Real programs combine three <b>constructs</b>:</p>
<ul><li><b>Sequence</b> — steps done in order, one after another.</li>
<li><b>Selection</b> — making a choice with IF … THEN … ELSE.</li>
<li><b>Iteration</b> — repeating with a loop.</li></ul>
<h4>Putting them together</h4>
<pre class="code">questions = ["Favourite food?", "Favourite sport?", "Favourite colour?"]
for i in range(3):                 # iteration
    answer = input(questions[i])    # sequence
    if answer == "pizza":           # selection
        print("Me too!")
    else:
        print("Cool, I like", answer)</pre>
<h4>Same idea in pseudocode</h4>
<pre class="code">FOR i ← 0 TO 2
    OUTPUT Questions[i]
    INPUT Answer
    IF Answer = "pizza" THEN
        OUTPUT "Me too!"
    ELSE
        OUTPUT "Cool, I like " + Answer
    ENDIF
NEXT i</pre>
<h4>Improving the chatbot (iterations)</h4>
<p>Store questions and replies in arrays so that adding a new question means adding one item, not new code. Test each new version before adding more — that is iterative development.</p>
<div class="tip">In a flowchart: the IF is a <b>diamond</b> with Yes/No arrows; the loop is a diamond with an arrow going back up.</div>
<div class="keywords"><b>Key words:</b> construct, sequence, selection, iteration, IF/ELSE, combine, array</div>`
},
{

  reading: `
<p>A <b>test plan</b> is a table that lists the tests you will do, the data you will use, the result you <b>expect</b>, and the <b>actual</b> result.</p>
<h4>Three kinds of test data</h4>
<p>Example: a program accepts ages from <b>11 to 16</b>.</p>
<table class="tbl"><tr><th>Type</th><th>Meaning</th><th>Example</th></tr>
<tr><td><b>Normal</b></td><td>Sensible data the program should accept.</td><td>13, 14</td></tr>
<tr><td><b>Extreme</b> (boundary)</td><td>Data right at the edge of what is allowed — still accepted.</td><td>11 and 16</td></tr>
<tr><td><b>Invalid</b></td><td>Data that should be rejected — outside the range or wrong type.</td><td>10, 17, -5, "twelve"</td></tr></table>
<h4>Example test plan</h4>
<table class="tbl"><tr><th>Test</th><th>Data</th><th>Type</th><th>Expected</th><th>Actual</th></tr>
<tr><td>1</td><td>14</td><td>Normal</td><td>Accepted</td><td>Accepted ✓</td></tr>
<tr><td>2</td><td>16</td><td>Extreme</td><td>Accepted</td><td>Rejected ✗</td></tr>
<tr><td>3</td><td>abc</td><td>Invalid</td><td>"Please enter a number"</td><td>Program crashed ✗</td></tr></table>
<p>Test 2 found a <b>logic error</b> (probably <code>age &lt; 16</code> instead of <code>age &lt;= 16</code>). Test 3 found a <b>runtime error</b> (<code>int("abc")</code>).</p>
<div class="tip">Always test both extremes — boundaries are where most logic errors hide.</div>
<div class="keywords"><b>Key words:</b> test plan, normal data, extreme data, boundary, invalid data, expected result, actual result</div>`
},
{
  id: "9.1.9", title: "Go further: strings & pseudocode", pages: "49–52",

{

  reading: `
<p><b>Software</b> is the programs that run on a computer. <b>System software</b> runs the computer itself; <b>application software</b> (games, browsers, word processors) helps users do tasks.</p>
<h4>The operating system (OS)</h4>
<p>The OS is the most important system software (e.g. Windows, macOS, Android, iOS, Linux). It sits between the user, the applications and the hardware. Its jobs:</p>
<ul><li><b>User interface</b> — lets you control the computer (windows, icons, touch).</li>
<li><b>Memory management</b> — decides which programs use which part of RAM.</li>
<li><b>Multitasking / process management</b> — shares the processor between running programs.</li>
<li><b>File management</b> — saving, opening, naming, moving and deleting files and folders.</li>
<li><b>Managing peripherals</b> — talks to printers, keyboards, mice (using drivers).</li>
<li><b>Security</b> — user accounts, passwords and permissions.</li></ul>
<h4>Utility programs</h4>
<p>Small programs that help <b>maintain</b> and <b>protect</b> the computer.</p>
<ul><li><b>Device drivers</b> — let the OS communicate with a piece of hardware, like a printer or graphics card.</li>
<li><b>Security software</b> — anti-virus/anti-malware scans for and removes harmful software; firewalls block unwanted network traffic.</li>
<li><b>Defragmentation</b> — on a hard disk drive, files get split into pieces scattered across the disk. Defragmenting puts the pieces back together, so files load faster. (Not needed on SSDs.)</li>
<li>Others: backup, compression, disk clean-up.</li></ul>
<div class="keywords"><b>Key words:</b> operating system, system software, application software, utility, driver, anti-virus, firewall, defragmentation</div>`
},
{
  id: "9.4.2", title: "Digitising sound & data storage", pages: "135–139",
  objectives: ["9CS.05", "9CS.06"],
  summary: "Sound is sampled to turn it into numbers; storage is measured in bits, bytes, KB, MB, GB, TB.",
  reading: `
<p><b>Analogue</b> sound is a smooth, continuous wave. Computers only store <b>digital</b> data — 1s and 0s. So sound must be <b>digitised</b>.</p>
<h4>How sound is digitised</h4>
<ol><li>A <b>microphone</b> turns the sound wave into an electrical signal.</li>
<li>An <b>analogue-to-digital converter (ADC)</b> measures the height (amplitude) of the wave many times a second. Each measurement is a <b>sample</b>.</li>
<li>Each sample is stored as a binary number.</li></ol>
<ul><li><b>Sample rate</b> — how many samples per second, measured in hertz (Hz). CD quality is 44 100 Hz. Higher rate = closer to the real sound, but a bigger file.</li>
<li><b>Sample resolution / bit depth</b> — how many bits are used for each sample. More bits = more accurate, but bigger file.</li></ul>
<div class="tip">Samples in a recording = sample rate × seconds. 1000 Hz for 5 seconds = 5000 samples.</div>
<h4>Storage units</h4>
<table class="tbl"><tr><th>Unit</th><th>Size</th></tr>
<tr><td>Bit</td><td>A single 0 or 1</td></tr><tr><td>Nibble</td><td>4 bits</td></tr>
<tr><td>Byte</td><td>8 bits</td></tr><tr><td>Kilobyte (KB)</td><td>1024 bytes</td></tr>
<tr><td>Megabyte (MB)</td><td>1024 KB</td></tr><tr><td>Gigabyte (GB)</td><td>1024 MB</td></tr><tr><td>Terabyte (TB)</td><td>1024 GB</td></tr></table>
<p><b>Converting:</b> going to a <b>smaller</b> unit → <b>multiply</b> (by 1024, or 8 for bytes → bits). Going to a <b>bigger</b> unit → <b>divide</b>.</p>
<p>Example: 2 MB = 2 × 1024 = 2048 KB. 4096 MB ÷ 1024 = 4 GB.</p>
<div class="keywords"><b>Key words:</b> analogue, digital, sample, sample rate, bit depth, ADC, bit, byte, kilobyte, megabyte, gigabyte, terabyte</div>`
},
{
  id: "9.4.3", title: "Computer programming languages", pages: "140–142",
  objectives: ["9CS.04"],
  summary: "Translators turn high-level code into machine code. Compilers do it all at once; interpreters line by line.",
  reading: `
<p>Computers only understand <b>machine code</b> — binary. Humans write in <b>high-level languages</b> like Python that use English-like words. So code must be translated.</p>
<h4>Types of language</h4>
<ul><li><b>High-level</b> (Python, Java, C#): easy for people to read and write; must be translated.</li>
<li><b>Low-level</b>: machine code (binary) and assembly language — close to what the processor understands.</li></ul>
<h4>Translators</h4>
<p>A <b>translator</b> is a program that converts code into machine code. Three types: <b>compiler</b>, <b>interpreter</b> and <b>assembler</b> (for assembly language).</p>
<table class="tbl"><tr><th>Compiler</th><th>Interpreter</th></tr>
<tr><td>Translates the <b>whole program at once</b></td><td>Translates and runs <b>one line at a time</b></td></tr>
<tr><td>Makes an <b>executable file</b> you can run again without translating</td><td>No executable file; it must translate every time the program runs</td></tr>
<tr><td>Finished program runs <b>fast</b></td><td>Runs more <b>slowly</b></td></tr>
<tr><td>Reports all errors at the end — harder to find</td><td>Stops at the <b>first error</b> — easy to find and fix</td></tr>
<tr><td>Source code can be kept secret</td><td>Users need the source code and the interpreter</td></tr>
<tr><td>Good for <b>finished</b> software you sell</td><td>Good for <b>developing and testing</b></td></tr></table>
<div class="tip">Python is usually run with an interpreter — that is why it stops at the line with the error.</div>
<div class="keywords"><b>Key words:</b> high-level, low-level, machine code, translator, compiler, interpreter, assembler, executable, source code</div>`
},
{
  id: "9.4.4", title: "The fetch–decode–execute cycle", pages: "143–146",
  objectives: ["9CS.08", "9CS.09"],
  summary: "Programs are lists of instructions stored in memory; the CPU fetches, decodes and executes them one at a time.",
  reading: `
<p>A program is a <b>list of instructions</b> stored in <b>memory (RAM)</b>. The <b>CPU</b> (central processing unit) runs them <b>one at a time</b>, in order, billions of times a second. This repeating process is the <b>fetch–decode–execute cycle</b>.</p>
<h4>The three stages</h4>
<ol><li><b>Fetch</b> — the CPU gets the next instruction from memory. The <b>program counter</b> holds the address of the next instruction and then goes up by 1.</li>
<li><b>Decode</b> — the <b>control unit</b> works out what the instruction means (what to do and what data to use).</li>
<li><b>Execute</b> — the instruction is carried out, e.g. the <b>ALU</b> (arithmetic logic unit) adds two numbers, or data is stored.</li></ol>
<p>Then the cycle repeats with the next instruction.</p>
<h4>Parts of the CPU</h4>
<ul><li><b>Control unit (CU)</b> — directs the cycle and decodes instructions.</li>
<li><b>ALU</b> — does calculations (+ − ) and logic comparisons (AND, OR, &gt;, =).</li>
<li><b>Registers</b> — tiny, super-fast stores inside the CPU (e.g. program counter).</li>
<li><b>Clock</b> — sends pulses that time each cycle. Clock speed is measured in GHz (billions of cycles per second).</li></ul>
<div class="tip">Memory trick: <b>F</b>ind it, <b>D</b>ecide what it means, <b>E</b>xecute it.</div>
<div class="keywords"><b>Key words:</b> CPU, instruction, memory, RAM, fetch, decode, execute, program counter, control unit, ALU, register, clock speed</div>`
},
{
  id: "9.4.5", title: "Logic circuits", pages: "147–149",
  objectives: ["9CS.07"],
  summary: "AND, OR and NOT gates combine to make circuits for Boolean expressions.",
  reading: `
<p>Inside computers, <b>logic gates</b> take binary inputs (1 = on/true, 0 = off/false) and produce an output.</p>
<table class="tbl"><tr><th>Gate</th><th>Rule</th><th>Symbol shape</th></tr>
<tr><td><b>AND</b></td><td>Output is 1 only if <b>both</b> inputs are 1</td><td>D-shape (flat back, round front)</td></tr>
<tr><td><b>OR</b></td><td>Output is 1 if <b>at least one</b> input is 1</td><td>Curved back, pointed front</td></tr>
<tr><td><b>NOT</b></td><td>Only one input; output is the <b>opposite</b></td><td>Triangle with a small circle</td></tr></table>
<h4>Truth tables</h4>
<table class="tbl"><tr><th>A</th><th>B</th><th>A AND B</th><th>A OR B</th><th>NOT A</th></tr>
<tr><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td></tr><tr><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td></tr>
<tr><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td></tr></table>
<p>With 2 inputs there are 4 rows; with 3 inputs there are 8 rows.</p>
<h4>Drawing a circuit from a Boolean expression</h4>
<p>Expression: <b>Q = (A AND B) OR NOT C</b></p>
<ol><li>Work out what is in brackets first: A and B go into an <b>AND</b> gate.</li>
<li>C goes into a <b>NOT</b> gate.</li>
<li>The outputs of both go into an <b>OR</b> gate, giving Q.</li></ol>
<p>Real example: an alarm sounds (Q) if the door is open (A) AND the alarm is set (B).  Q = A AND B.</p>
<div class="keywords"><b>Key words:</b> logic gate, AND, OR, NOT, input, output, truth table, Boolean expression, logic circuit</div>`
},
{
  id: "9.4.6", title: "Machine learning and computerisation", pages: "150–155",
  objectives: ["9CS.01", "9CS.10", "9CS.11"],
  summary: "Devices are improved through prototypes; machine learning finds patterns in data; Industry 4.0 brings benefits and risks.",
  reading: `
<h4>Improving digital devices</h4>
<p>Designers build <b>prototypes</b>, test them with users and improve them. They think about:</p>
<ul><li><b>User experience (UX)</b> — is it easy and enjoyable to use?</li>
<li><b>Accessibility</b> — can everyone use it, including people with disabilities? (screen readers, large text, voice control, captions)</li>
<li><b>Ergonomics</b> — is it comfortable and safe for the body? (shape, weight, button position, screen height)</li>
<li><b>Emerging technologies</b> — new tech that could improve it (foldable screens, AI assistants, better batteries).</li></ul>
<h4>Machine learning (ML)</h4>
<p>Machine learning is a type of <b>artificial intelligence</b> where a computer <b>learns from data</b> to find patterns and make predictions, instead of being told every rule. The more good data, the better it gets.</p>
<p>Examples: recommendations on YouTube and Netflix; spam email filters; face recognition to unlock phones; voice assistants; self-driving cars; spotting diseases in medical scans; detecting bank card fraud; predictive text.</p>
<h4>Computerisation and Industry 4.0</h4>
<p><b>Industry 4.0</b> is the "fourth industrial revolution": factories using robots, sensors, the Internet of Things, AI and data to automate production.</p>
<table class="tbl"><tr><th>Benefits</th><th>Risks</th></tr>
<tr><td>Faster production, 24/7</td><td>Loss of some jobs</td></tr>
<tr><td>Fewer mistakes, consistent quality</td><td>High cost to set up</td></tr>
<tr><td>Robots do dangerous jobs — safer</td><td>Cyber attacks could stop a factory</td></tr>
<tr><td>Less waste, lower costs</td><td>Workers need new skills / retraining</td></tr>
<tr><td>New, skilled jobs created</td><td>Dependence on technology if it fails</td></tr></table>
<div class="keywords"><b>Key words:</b> prototype, user experience, accessibility, ergonomics, emerging technology, machine learning, AI, Industry 4.0, automation</div>`
},
{
  id: "9.4.7", title: "Go further: storage conversions", pages: "155–156",
  objectives: ["9CS.06"],
  summary: "Practise converting between bits, bytes, KB, MB, GB and TB — and work out file sizes.",
  reading: `
<h4>The conversion ladder</h4>
<pre class="code">TB  ×1024 →  GB  ×1024 →  MB  ×1024 →  KB  ×1024 →  bytes  ×8 →  bits
TB  ← ÷1024  GB  ← ÷1024  MB  ← ÷1024  KB  ← ÷1024  bytes  ← ÷8  bits</pre>
<p><b>Down the ladder</b> (to smaller units) → multiply. <b>Up the ladder</b> (to bigger units) → divide.</p>
<h4>Worked examples</h4>
<ul><li>3 KB → bytes: 3 × 1024 = <b>3072 bytes</b></li>
<li>16 bytes → bits: 16 × 8 = <b>128 bits</b></li>
<li>2048 MB → GB: 2048 ÷ 1024 = <b>2 GB</b></li>
<li>1 GB → KB: 1 × 1024 × 1024 = <b>1 048 576 KB</b> (two steps)</li></ul>
<h4>Will it fit?</h4>
<p>A USB stick has 2 GB free. Each photo is 4 MB. How many photos fit? 2 GB = 2048 MB. 2048 ÷ 4 = <b>512 photos</b>.</p>
<h4>Sound file size</h4>
<p>File size (bits) = sample rate × bit depth × seconds. Then ÷ 8 for bytes.</p>
<p>Example: 1000 Hz × 8 bits × 10 s = 80 000 bits = 10 000 bytes.</p>
<div class="tip">Some people use 1000 instead of 1024 (e.g. hard drive adverts). In this course we use <b>1024</b>.</div>`
},
{

  id: "u3", semester: 1, num: 3,
  title: "Modelling & data",

{
  id: "9.3.1", title: "Evaluating the use of models", pages: "",
  objectives: ["9MD.01", "9MD.02"],
  summary: "A model is a simplified version of a real system. Judge how useful and accurate it is.",
  reading: `
<p>A <b>computer model</b> is a simplified representation of a real-life system. It uses data and rules (formulas) to show what might happen. Examples: weather forecasts, a pocket-money budget, traffic light timing, flight simulators, predicting how a disease spreads.</p>
<h4>Why use models?</h4>
<ul><li><b>Safer</b> — test a bridge design or emergency plan without danger.</li>
<li><b>Cheaper</b> — no need to build the real thing first.</li>
<li><b>Faster</b> — simulate years in seconds.</li>
<li><b>"What if?"</b> questions — change a value and see what happens.</li></ul>
<h4>Limitations</h4>
<ul><li>A model is only as good as its <b>data and rules</b> ("garbage in, garbage out").</li>
<li>It is <b>simplified</b> — it may leave out factors (e.g. weather, human behaviour).</li>
<li>Predictions can be wrong, so results should be checked against real life.</li></ul>
<h4>Evaluating a model — ask:</h4>
<ul><li>Is the data accurate and up to date?</li><li>Does it include all the important factors?</li><li>Do its results match what happens in real life?</li><li>Is it easy to use and change?</li></ul>
<h4>Functions that help analyse a model</h4>
<table class="tbl"><tr><th>Function</th><th>What it does</th><th>Example</th></tr>
<tr><td>MAX</td><td>Largest value</td><td>=MAX(B2:B10)</td></tr><tr><td>MIN</td><td>Smallest value</td><td>=MIN(B2:B10)</td></tr>
<tr><td>COUNT</td><td>How many cells contain <b>numbers</b></td><td>=COUNT(B2:B10)</td></tr>
<tr><td>IF</td><td>Checks a condition, gives one result if true and another if false</td><td>=IF(B2>=50,"Pass","Fail")</td></tr></table>
<div class="keywords"><b>Key words:</b> model, simulation, real-life system, variable, rule, what-if, limitation, evaluate</div>`
},
{
  id: "9.3.2", title: "Spreadsheets: key formulas and creating models", pages: "",
  objectives: ["9MD.02", "9MD.03", "9MD.04"],
  summary: "Use IF, MIN, MAX and COUNT, build your own model, and judge whether a spreadsheet is fit for purpose.",
  reading: `
<p>A <b>spreadsheet</b> is a grid of <b>cells</b>. Each cell has an address: column letter + row number, e.g. <b>B3</b>. A group of cells is a <b>range</b>, e.g. <b>B2:B10</b>.</p>
<h4>Formulas and functions</h4>
<p>Every formula starts with <b>=</b>. A <b>function</b> is a ready-made formula.</p>
<ul><li><code>=MAX(C2:C20)</code> — highest score</li>
<li><code>=MIN(C2:C20)</code> — lowest score</li>
<li><code>=COUNT(C2:C20)</code> — how many cells contain numbers (blank cells and text are not counted)</li>
<li><code>=IF(C2>=70,"Pass","Retry")</code> — shows Pass if C2 is 70 or more, otherwise Retry</li>
<li><code>=SUM(C2:C20)</code> and <code>=AVERAGE(C2:C20)</code> are also useful</li></ul>
<h4>IF in detail</h4>
<p><code>=IF(condition, value_if_true, value_if_false)</code>. Conditions use <b>&gt;  &lt;  &gt;=  &lt;=  =  &lt;&gt;</b> (&lt;&gt; means "not equal"). Text must be in "quotes".</p>
<h4>Creating a model — e.g. a school trip budget</h4>
<table class="tbl"><tr><th></th><th>A</th><th>B</th></tr><tr><td>1</td><td>Students</td><td>30</td></tr><tr><td>2</td><td>Cost per student</td><td>12</td></tr><tr><td>3</td><td>Total cost</td><td>=B1*B2</td></tr><tr><td>4</td><td>Budget</td><td>400</td></tr><tr><td>5</td><td>Within budget?</td><td>=IF(B3&lt;=B4,"Yes","No")</td></tr></table>
<p>Change B1 to 35 and the model recalculates automatically — a "what if?" question.</p>
<h4>Is an existing spreadsheet suitable? (9MD.04)</h4>
<ul><li>Does it do what is needed (right data, right calculations)?</li><li>Are the formulas correct — or are there typed-in numbers that won't update?</li><li>Is it clear: labels, headings, formatting, charts?</li><li>Is it easy for the intended user to update?</li><li>Does it have validation to stop wrong data being entered?</li></ul>
<div class="keywords"><b>Key words:</b> cell, cell reference, range, formula, function, IF, MAX, MIN, COUNT, model, validation</div>`
},
{
  id: "9.3.3", title: "Relational databases: linking and searching", pages: "",
  objectives: ["9MD.05", "9MD.06", "9MD.07"],
  summary: "Tables are linked by key fields; searches can use two or more criteria with AND/OR.",
  reading: `
<p>A <b>database</b> stores data in an organised way. Data is stored in <b>tables</b>. Each row is a <b>record</b> (one thing, e.g. one student). Each column is a <b>field</b> (one detail, e.g. name).</p>
<h4>Keys</h4>
<ul><li><b>Primary key</b> — a field that is <b>unique</b> for every record, e.g. StudentID. No two records can share it.</li>
<li><b>Foreign key</b> — a primary key from one table placed in another table to <b>link</b> them.</li></ul>
<h4>Relational database</h4>
<p>A <b>relational database</b> has <b>two or more linked tables</b>.</p>
<table class="tbl"><tr><th colspan="3">Students</th></tr><tr><th>StudentID (PK)</th><th>Name</th><th>ClassID (FK)</th></tr><tr><td>S01</td><td>Ana</td><td>C8A</td></tr><tr><td>S02</td><td>Ben</td><td>C8B</td></tr></table>
<table class="tbl"><tr><th colspan="2">Classes</th></tr><tr><th>ClassID (PK)</th><th>Teacher</th></tr><tr><td>C8A</td><td>Ms Lim</td></tr><tr><td>C8B</td><td>Mr Cruz</td></tr></table>
<p>The teacher's name is stored <b>once</b>, not in every student's record. This avoids repeated data (<b>redundancy</b>) and mistakes when updating.</p>
<h4>Complex searches (queries)</h4>
<p>A <b>query</b> finds records that match <b>criteria</b>. Complex searches use two or more criteria:</p>
<ul><li><b>AND</b> — both must be true (gives <b>fewer</b> results). <i>Year = 8 AND Score &gt; 70</i></li>
<li><b>OR</b> — either can be true (gives <b>more</b> results). <i>Club = "Chess" OR Club = "Robotics"</i></li>
<li>Operators: =, &lt;&gt;, &gt;, &lt;, &gt;=, &lt;=</li></ul>
<p>Searching linked tables lets you combine data, e.g. "names of students taught by Ms Lim who scored over 70".</p>
<div class="keywords"><b>Key words:</b> database, table, record, field, primary key, foreign key, relationship, relational database, query, criteria, AND, OR</div>`
},
{
  id: "9.3.4", title: "Big Data", pages: "",
  objectives: ["9MD.08"],
  summary: "Huge, fast-growing, varied data sets that need special tools — and how they are used.",
  reading: `
<p><b>Big Data</b> means data sets that are so <b>large</b>, arrive so <b>fast</b> and come in so many <b>different forms</b> that normal software (like a simple spreadsheet) cannot store or analyse them.</p>
<h4>The 3 Vs</h4>
<ul><li><b>Volume</b> — a huge amount of data (terabytes, petabytes and more).</li>
<li><b>Velocity</b> — data is created and collected very quickly, often in real time.</li>
<li><b>Variety</b> — many types: text, photos, videos, GPS locations, sensor readings, clicks.</li></ul>
<p>Some people add <b>Veracity</b> (how accurate/trustworthy it is) and <b>Value</b> (how useful it is).</p>
<h4>Where does it come from?</h4>
<p>Social media, online shopping, smartphones, sensors (Internet of Things), bank transactions, satellites, hospital records, loyalty cards.</p>
<h4>Applications</h4>
<ul><li><b>Shopping</b> — recommending products, predicting what to stock.</li>
<li><b>Healthcare</b> — spotting disease outbreaks, finding patterns in patient data.</li>
<li><b>Transport</b> — live traffic in map apps, planning bus routes.</li>
<li><b>Weather</b> — more accurate forecasts.</li>
<li><b>Sport</b> — analysing player performance.</li>
<li><b>Banking</b> — detecting fraud quickly.</li>
<li><b>Cities</b> — "smart cities" managing energy and lighting.</li></ul>
<h4>Concerns</h4>
<p><b>Privacy</b> (who has my data?), <b>security</b> (data breaches), and <b>accuracy</b> (wrong data → wrong decisions). Big Data is often analysed using <b>machine learning</b>.</p>
<div class="keywords"><b>Key words:</b> Big Data, volume, velocity, variety, veracity, data analysis, privacy, Internet of Things</div>`
}

  summary: "A network connects devices so they can share. Bus, ring and star are three ways to arrange them.",
  reading: `
<p>A <b>network</b> is two or more devices connected so they can share data, files, printers and an internet connection.</p>
<h4>Network types and hardware</h4>
<ul><li><b>LAN</b> (local area network) — a small area like a school or home.</li>
<li><b>WAN</b> (wide area network) — a large area, e.g. across countries. The internet is the biggest WAN.</li>
<li><b>Node</b> — any device on a network (computer, printer, phone).</li>
<li><b>Switch</b> — connects devices in a LAN and sends data only to the device it is meant for.</li>
<li><b>Router</b> — connects different networks together, e.g. your home network to the internet.</li>
<li><b>Cable</b> or <b>wireless (Wi-Fi)</b> — the transmission media.</li></ul>
<h4>Topology</h4>
<p>A <b>topology</b> is the <b>layout</b> — the way devices are connected.</p>

<ul><li><b>Bus</b> — all devices connect to <b>one main cable</b> (the backbone), with terminators at each end.</li>

<h4>Network architecture</h4>
<p>Architecture is how the computers on a network share jobs.</p>

  reading: `
<p>A <b>protocol</b> is a set of <b>rules</b> that devices follow so they can communicate. Like people agreeing to speak the same language, devices must agree how data is formatted, sent, received and checked for errors.</p>
<h4>Packets</h4>
<p>Data sent over a network is broken into small pieces called <b>packets</b>. Each packet has a <b>header</b> (the sender's and receiver's IP addresses, the packet number) and a <b>payload</b> (the actual data). Packets may take different routes and are put back together at the end.</p>
<h4>TCP/IP</h4>
<ul><li><b>TCP</b> (Transmission Control Protocol) — breaks data into packets, numbers them, and puts them back together <b>in the right order</b> at the destination. It checks that every packet arrived and asks for missing ones to be <b>resent</b>.</li>
<li><b>IP</b> (Internet Protocol) — gives every device an <b>IP address</b> (e.g. 192.168.1.5) and <b>routes</b> each packet to the right address.</li></ul>
<h4>HTTP and HTTPS</h4>
<ul><li><b>HTTP</b> (Hypertext Transfer Protocol) — the rules for requesting and sending <b>web pages</b> between a web browser (client) and a web server.</li>
<li><b>HTTPS</b> — the <b>secure</b> version; data is <b>encrypted</b>, so it is safe for passwords and payments. Look for the padlock in the address bar.</li></ul>
<h4>Other protocols you might meet</h4>
<p>FTP (file transfer), SMTP (sending email), IMAP/POP3 (receiving email).</p>
<div class="keywords"><b>Key words:</b> protocol, packet, header, payload, TCP, IP, IP address, routing, HTTP, HTTPS, encryption</div>`
},

<p>A network is <b>scalable</b> if it can easily <b>grow</b> (more users, devices or data) without needing to be rebuilt and without slowing down too much.</p>

{
  id: "9.2.5", title: "Checking for errors", pages: "71–73",
  objectives: ["9DC.04"],
  summary: "A parity bit is added so the receiver can check if a bit was changed during transmission.",
  reading: `
<p>When data travels, interference can flip a bit (0 → 1 or 1 → 0). A <b>parity check</b> helps the receiver find out if this happened.</p>
<h4>The parity bit</h4>
<p>An extra bit, called the <b>parity bit</b>, is added to each group of bits (often 7 data bits + 1 parity bit = 1 byte).</p>
<ul><li><b>Even parity</b>: the total number of 1s (including the parity bit) must be <b>even</b>.</li>
<li><b>Odd parity</b>: the total number of 1s must be <b>odd</b>.</li></ul>
<h4>Example — even parity</h4>
<p>Data: <code>1011001</code> has four 1s (even), so the parity bit is <b>0</b> → <code>01011001</code> (parity bit at the front).</p>
<p>Data: <code>1110000</code> has three 1s (odd), so the parity bit is <b>1</b> → <code>11110000</code>.</p>
<h4>Checking</h4>
<p>Sender and receiver agree on even or odd parity. The receiver counts the 1s. If even parity was used but the receiver counts an <b>odd</b> number of 1s → an <b>error</b> has happened and the data is sent again.</p>
<h4>Limitations</h4>
<ul><li>If <b>two</b> bits flip, the count is still even — the error is <b>not detected</b>.</li>
<li>Parity can tell you an error happened, but <b>not which bit</b> is wrong.</li></ul>
<div class="keywords"><b>Key words:</b> transmission error, interference, parity bit, even parity, odd parity, error detection</div>`
},
{
  id: "9.2.6", title: "Keeping it all secure", pages: "74–78",

  summary: "Choose security methods by balancing how sensitive the data is, cost and accessibility.",
  reading: `
<h4>Threats to networks</h4>
<p>Malware (viruses, ransomware, spyware), hackers, phishing emails, weak passwords, and people accidentally sharing data.</p>
<h4>Security methods</h4>
<ul><li><b>Passwords</b> and <b>two-factor authentication</b> (password + code on your phone).</li>
<li><b>Biometrics</b> — fingerprint or face recognition.</li>
<li><b>Firewall</b> — checks traffic coming in and out and blocks anything suspicious.</li>
<li><b>Encryption</b> — scrambles data so only someone with the key can read it.</li>
<li><b>Anti-malware</b> software.</li>
<li><b>Access levels / user permissions</b> — users only see what they need (students can't open the grades folder).</li>
<li><b>Backups</b> — copies of data in case it is lost or held by ransomware.</li>
<li><b>Physical security</b> — locked server rooms.</li></ul>
<h4>Making the right choices — balance three things</h4>
<ul><li><b>How sensitive is the data?</b> Medical records, bank details and exam results need <b>strong</b> security. A public school lunch menu needs very little.</li>
<li><b>Cost</b> — strong security (biometrics, expert staff, extra software) costs more. Spend most protecting the most valuable data.</li>
<li><b>Accessibility</b> — security must not make it too hard for the right people to use the system. Too many passwords → people write them down. Systems must also work for users with disabilities.</li></ul>
<h4>Machine learning in security</h4>
<p>Machine learning can learn what "normal" network activity looks like and flag unusual behaviour — spotting new malware, spam/phishing emails or fraudulent logins faster than humans.</p>
<div class="keywords"><b>Key words:</b> malware, phishing, firewall, encryption, authentication, biometrics, access level, backup, sensitive data, accessibility, cost</div>`
},
{
  id: "9.2.7", title: "Go further & two-dimensional parity checks", pages: "78–84",
  objectives: ["9DC.04"],
  summary: "Parity across rows AND columns finds exactly which bit is wrong — so it can be corrected.",
  reading: `
<p>A single parity bit can tell us <i>that</i> an error happened, but not <i>where</i>. A <b>two-dimensional (2D) parity check</b> solves this.</p>
<h4>How it works</h4>
<ol><li>Arrange the data bytes in a <b>grid</b> — one byte per row.</li>
<li>Add a <b>parity bit to each row</b>.</li>
<li>Add a <b>parity byte</b> at the bottom: a parity bit for <b>each column</b>.</li>
<li>The receiver checks every row and every column.</li></ol>
<h4>Example (even parity) — after transmission</h4>
<table class="tbl mono"><tr><th></th><th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>Parity</th></tr>
<tr><th>Row 1</th><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td></tr>
<tr><th>Row 2</th><td>0</td><td>1</td><td class="hl">1</td><td>0</td><td>1</td></tr>
<tr><th>Row 3</th><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td></tr>
<tr><th>Parity</th><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td></tr></table>
<p>Check every row: Row 1 has four 1s ✓, <b>Row 2 has three 1s ✗ (odd)</b>, Row 3 has two ✓. Check every column: C1 ✓, C2 ✓, <b>C3 has three 1s ✗ (odd)</b>, C4 ✓. The error is where the <b>bad row and bad column cross</b> — Row 2, C3. That bit should be <b>0</b>, so the receiver can simply <b>flip it back</b> to correct it, without asking for the data to be sent again.</p>
<div class="tip">Find the row with the wrong parity, find the column with the wrong parity — the error is where they meet.</div>
<h4>Why it's better</h4>
<ul><li>It <b>locates</b> a single-bit error, so it can be <b>corrected</b> without resending.</li><li>It needs extra bits (more data to send), and some multi-bit errors can still be missed.</li></ul>
<div class="keywords"><b>Key words:</b> two-dimensional parity, parity byte, row parity, column parity, error correction</div>`
},

<p><b>Decomposition</b> means breaking a big problem into <b>smaller, easier parts</b>. Each part can be solved, tested and even given to a different team member.</p>
<h4>Example: a login system</h4>
<ul><li>Ask for username</li><li>Ask for password</li><li>Check the details</li><li>Count the failed attempts</li><li>Lock the account after 3 failures</li></ul>
<h4>Sub-programs</h4>
<p>A <b>sub-program</b> (also called a <b>sub-routine</b>, procedure or function) is a named block of code that does one job. You write it once and <b>call</b> it whenever you need it.</p>
<pre class="code">def welcome(name):
    print("Welcome,", name)

welcome("Ana")
welcome("Ben")</pre>
<p><b>Benefits:</b> less repeated code; easier to read, test and fix; can be reused in other programs; teams can work on different parts at once.</p>
<h4>Development processes — and evaluating them (9P.07)</h4>
<ul><li><b>Iterative development</b> — build prototypes, test, improve, repeat. Good when needs may change; gets feedback early.</li>
<li><b>Step-by-step / "all at once"</b> — plan everything, then code everything, then test at the end. Problems may only be found late, when they are harder to fix.</li></ul>
<p>To <b>evaluate</b> a process, ask: Did planning (decomposition, flowcharts) save time? Were errors found early? Did testing cover normal, extreme and invalid data? Did user feedback improve the program? What would you do differently next time?</p>
<div class="keywords"><b>Key words:</b> decomposition, sub-program, sub-routine, procedure, function, call, reuse, evaluate, development process</div>`

  reading: `
<p>Loops can be tricky to predict. A <b>trace table</b> lets you follow them one step at a time.</p>

<p>This should add up the numbers 1 to 5 (answer 15):</p>

for n in range(1, 5):

print(total)</pre>

OUTPUT Count</pre>

  reading: `
<h4>Looping through a list</h4>
<pre class="code">scores = [12, 18, 9, 20]
total = 0
for i in range(len(scores)):
    total = total + scores[i]
print(total)       # 59</pre>
<h4>Linear search</h4>
<p>Check each item <b>one by one</b> from the start until you find it. Works on any list (sorted or not) but can be slow for long lists.</p>
<h4>Binary search</h4>
<p>A much faster search — but the list <b>must be sorted</b>.</p>
<ol><li>Look at the <b>middle</b> item.</li>
<li>If it is the target — found!</li>
<li>If the target is <b>smaller</b>, throw away the right half. If <b>bigger</b>, throw away the left half.</li>
<li>Repeat with the half that is left until found (or nothing is left).</li></ol>
<p>Example: find <b>23</b> in [3, 8, 12, 17, 23, 31, 40]</p>
<ul><li>Middle = 17 (index 3). 23 &gt; 17 → keep right half [23, 31, 40]</li>
<li>Middle = 31. 23 &lt; 31 → keep left half [23]</li><li>Middle = 23 → found in <b>3 comparisons</b>. (Linear search needed 5.)</li></ul>
<div class="tip">Middle index = (low + high) ÷ 2, rounded down. Each step halves the list — 1000 items need at most about 10 checks!</div>
<div class="keywords"><b>Key words:</b> iterate, linear search, binary search, sorted, middle, comparison, efficient</div>`
},

<h4>A debugging routine</h4>
<ol><li><b>Read</b> the error message — it gives the line number and type (SyntaxError, IndexError, TypeError, NameError, ZeroDivisionError).</li>
<li>No message but wrong result? It's a <b>logic</b> error — use a <b>trace table</b>.</li>
<li>Fix <b>one</b> thing at a time, then run your <b>test plan</b> again.</li></ol>
<h4>Correcting pseudocode</h4>
<pre class="code">// Should output the largest number in the array

NEXT i
OUTPUT Max</pre>
<p>The comparison is the wrong way round — it finds the <b>smallest</b>. Fix: <code>Numbers[i] &gt; Max</code>.</p>
